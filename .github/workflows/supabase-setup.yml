# Exécute une fois le SQL Supabase (stats PDF, visiteurs, favoris).
# Prérequis : secret SUPABASE_ACCESS_TOKEN (token https://supabase.com/dashboard/account/tokens)
name: Supabase — configuration SQL

on:
  workflow_dispatch:

jobs:
  run-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exécuter TOUT-EXECUTER-UNE-FOIS.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Secret SUPABASE_ACCESS_TOKEN manquant."
            echo "GitHub → Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          SQL=$(cat supabase/TOUT-EXECUTER-UNE-FOIS.sql)
          JSON=$(node -e "
            const fs = require('fs');
            const q = fs.readFileSync('supabase/TOUT-EXECUTER-UNE-FOIS.sql','utf8');
            process.stdout.write(JSON.stringify({ query: q }));
          ")
          curl -sS -f -X POST \
            "https://api.supabase.com/v1/projects/wxiqqcnzcxswdqzubxyt/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON"

      - name: Vérifier API stats PDF
        run: |
          KEY=$(grep "SUPABASE_ANON_KEY" js/site-config.js | sed "s/.*= '//;s/';//")
          curl -sS -f -X POST \
            "https://wxiqqcnzcxswdqzubxyt.supabase.co/rest/v1/rpc/get_pdf_stats_totals" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
