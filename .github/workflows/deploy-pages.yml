name: Deploy site to GitHub Pages

# Le site est publié automatiquement par « pages build and deployment » (source : branche main).
# Ce workflow Actions échouait car l’artifact dépasse 1 Go (PDF + simulateur).
# Conservé en déclenchement manuel uniquement, si besoin plus tard.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer l’artifact (sans outils dev)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv-pdf' \
            --exclude='node_modules' \
            --exclude='scripts' \
            --exclude='supabase' \
            ./ _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
