name: Deploy site to GitHub Pages

# Artifact Pages limité à ~1 Go. On exclut pdf/ (~2,8 Go) pour republier
# le site + swissdz-panel. data/ reste publié (catalogue bibliothèque ~5 Mo).
# Miroir de secours panel :
# https://cdn.jsdelivr.net/gh/manou87/electro-dz@main/swissdz-panel/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer l’artifact (<1 Go, sans pdf/)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv-pdf' \
            --exclude='node_modules' \
            --exclude='scripts' \
            --exclude='supabase' \
            --exclude='pdf' \
            --exclude='swissdz-panel/backups' \
            --exclude='swissdz-panel/assets/electrodz/_pre_swissdz_brand_backup' \
            --exclude='.github-token.local' \
            --exclude='.supabase-access-token' \
            --exclude='.DS_Store' \
            ./ _site/
          # Domaine custom (si absent du dépôt)
          if [ ! -f _site/CNAME ]; then
            echo 'electro-dz.com' > _site/CNAME
          fi
          touch _site/.nojekyll
          du -sh _site
          find _site -type f | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
