<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="stylesheet" href="css/site-brand.css" />
  <link rel="stylesheet" href="css/quiz-nfc.css?v=demo2" />
  <title>Démo quiz visuel — NF C 15-100 | Electro DZ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 5%;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      color: #facc15;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }
    .lang-btn {
      background: none;
      border: 1px solid #cbd5e1;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .lang-btn.active {
      background: #facc15;
      color: #0f172a;
      border-color: #facc15;
    }
    .demo-banner {
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      padding: 8px 5%;
      background: rgba(250, 204, 21, 0.08);
      border-bottom: 1px solid rgba(250, 204, 21, 0.2);
    }
    .demo-banner strong { color: #fde68a; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">
      <img src="assets/app-icon.png" alt="" width="36" height="36" decoding="async" />
      <span>SwissDZ</span>
    </a>
    <div>
      <button type="button" class="lang-btn active" data-lang-fr>FR</button>
      <button type="button" class="lang-btn" data-lang-ar>AR</button>
      <button type="button" class="lang-btn" data-lang-en>EN</button>
    </div>
  </nav>

  <p class="demo-banner">
    <strong>Démo locale</strong> — 8 questions image (701, 702, 411, 534, 562, 771, 312) · pas encore dans le quiz principal
  </p>

  <main class="quiz-page">
    <div data-demo-quiz-root>
      <p style="text-align:center;color:#94a3b8;padding:40px">Chargement…</p>
    </div>
  </main>

  <script src="js/quiz-demo-figures.js?v=demo2" defer></script>
</body>
</html>
