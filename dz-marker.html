<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="js/theme-electric-neon.js?v=chrome1"></script>
  <meta name="description" content="DZ Marker — éditeur d’étiquettes de tableaux électriques (clone Electromarker). Accès par code." />
  <meta name="robots" content="noindex, follow" />
  <title>DZ Marker — Electro DZ</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="stylesheet" href="css/simulation-swissdz.css?v=20260917chrome1" />
  <link rel="stylesheet" href="css/ecole-electricite.css?v=20261007-logo" />
  <link rel="canonical" href="https://electro-dz.com/dz-marker.html" />
  <style>
    /* Soft gate only — no product copy beyond shell chrome */
    .dz-marker-frame { background: #111; }
  </style>
</head>
<body class="sim-page ecole-page">
  <header class="sim-topbar">
    <a href="index-fr.html" class="sim-brand" data-i18n-href-fr="index-fr.html" data-i18n-href-ar="index.html">
      <img src="electromarker/favicon.png" alt="" width="32" height="32" decoding="async" />
      <span>DZ <span class="accent">Marker</span></span>
    </a>
    <a href="index-fr.html" class="edz-home-link" data-edz-home="1" data-i18n="nav.home">Accueil</a>
    <div class="sim-top-actions">
      <div class="sim-lang">
        <button type="button" class="lang-btn active" data-lang="fr" aria-label="Français">FR</button>
        <button type="button" class="lang-btn" data-lang="ar" aria-label="العربية">AR</button>
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
      </div>
      <button type="button" class="sim-fs-toggle" id="simFsToggle" aria-pressed="false" aria-controls="simFrameWrap" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm12 0h-2v3h-3v2h5v-5zM7 7h3V5H5v5h2V7zm12-2h-5v2h3v3h2V5z"/>
        </svg>
        <span class="sim-fs-enter" data-i18n="fs.enter">Plein écran</span>
        <span class="sim-fs-exit" data-i18n="fs.exit">Quitter</span>
      </button>
    </div>
  </header>

  <div class="sim-workspace ecole-workspace">
    <section id="ecoleGate" class="ecole-gate" aria-labelledby="ecoleGateTitle">
      <div class="ecole-gate-card">
        <img class="ecole-app-logo" src="electromarker/favicon.png" alt="DZ Marker" width="96" height="96" decoding="async" />
        <p class="ecole-badge" data-i18n="badge">DZ Marker</p>
        <h1 id="ecoleGateTitle" data-i18n="title">DZ Marker</h1>
        <p class="ecole-lead" data-i18n="lead">
          Accédez à DZ Marker — éditeur d’étiquettes pour tableaux électriques.
        </p>
        <form id="ecoleGateForm" class="ecole-gate-form" autocomplete="off">
          <label for="ecoleCode" data-i18n="codeLabel">Code d’accès</label>
          <input
            id="ecoleCode"
            name="code"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="••••••••"
            required
          />
          <button type="submit" id="ecoleEnter" data-i18n="enter">Entrer</button>
          <p class="ecole-err" id="ecoleGateErr" hidden data-i18n-err="err">Code incorrect. Réessayez.</p>
        </form>
      </div>
    </section>

    <div class="sim-frame-wrap ecole-frame-wrap" id="simFrameWrap" hidden>
      <p class="sim-loading" id="simLoading" data-i18n="loading">Chargement de DZ Marker…</p>
      <iframe
        id="simFrame"
        class="dz-marker-frame"
        title="DZ Marker — éditeur d’étiquettes"
        allow="fullscreen"
        allowfullscreen
        loading="lazy"
      ></iframe>
      <button type="button" class="sim-fs-close" id="simFsClose">
        <span class="sim-fs-close-x" aria-hidden="true">×</span>
        <span data-i18n="fs.close">Fermer</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      var LANG_STORAGE = "electrodz-site-lang";
      var UNLOCK_KEY = "electrodz-dz-marker-unlocked";
      /* Soft gate: SHA-256 hex of normalized code "manoud" (trim + lower). Not a security boundary. */
      var ACCESS_CODE_SHA256 =
        "75b5bf0cb32d423ac51ddabfeb2c07d6b5536947b250a21260c234b3df5f0bff";

      var T = {
        fr: {
          "meta.title": "DZ Marker — Electro DZ",
          "meta.desc":
            "DZ Marker — éditeur d’étiquettes de tableaux électriques. Accès par code.",
          "nav.home": "Accueil",
          badge: "DZ Marker",
          title: "DZ Marker",
          lead: "Accédez à DZ Marker — éditeur d’étiquettes pour tableaux électriques.",
          codeLabel: "Code d’accès",
          enter: "Entrer",
          err: "Code incorrect. Réessayez.",
          loading: "Chargement de DZ Marker…",
          "fs.enter": "Plein écran",
          "fs.exit": "Quitter",
          "fs.close": "Fermer",
        },
        ar: {
          "meta.title": "DZ Marker — Electro DZ",
          "meta.desc": "DZ Marker — محرر ملصقات اللوحات الكهربائية. الدخول برمز.",
          "nav.home": "الرئيسية",
          badge: "DZ Marker",
          title: "DZ Marker",
          lead: "ادخل إلى DZ Marker — محرر ملصقات اللوحات الكهربائية.",
          codeLabel: "رمز الدخول",
          enter: "دخول",
          err: "رمز غير صحيح. أعد المحاولة.",
          loading: "جاري تحميل DZ Marker…",
          "fs.enter": "ملء الشاشة",
          "fs.exit": "خروج",
          "fs.close": "إغلاق",
        },
        en: {
          "meta.title": "DZ Marker — Electro DZ",
          "meta.desc":
            "DZ Marker — electrical panel label editor. Access code required.",
          "nav.home": "Home",
          badge: "DZ Marker",
          title: "DZ Marker",
          lead: "Access DZ Marker — electrical panel label editor.",
          codeLabel: "Access code",
          enter: "Enter",
          err: "Incorrect code. Please try again.",
          loading: "Loading DZ Marker…",
          "fs.enter": "Fullscreen",
          "fs.exit": "Exit",
          "fs.close": "Close",
        },
      };

      function normalizeLang(next) {
        return next === "fr" || next === "ar" || next === "en" ? next : "fr";
      }

      var lang = "fr";
      try {
        lang = normalizeLang(localStorage.getItem(LANG_STORAGE) || "");
      } catch (e) {}

      function t(k) {
        return (T[lang] && T[lang][k]) || T.fr[k] || k;
      }

      function isUnlocked() {
        try {
          return sessionStorage.getItem(UNLOCK_KEY) === "1";
        } catch (e) {
          return false;
        }
      }

      function setUnlocked() {
        try {
          sessionStorage.setItem(UNLOCK_KEY, "1");
        } catch (e) {}
      }

      function normalizeCode(raw) {
        return String(raw || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "");
      }

      function hexFromBuffer(buf) {
        var bytes = new Uint8Array(buf);
        var out = "";
        for (var i = 0; i < bytes.length; i++) {
          out += bytes[i].toString(16).padStart(2, "0");
        }
        return out;
      }

      function sha256Hex(text) {
        if (!window.crypto || !window.crypto.subtle) {
          return Promise.reject(new Error("subtle-crypto-unavailable"));
        }
        var data = new TextEncoder().encode(text);
        return window.crypto.subtle.digest("SHA-256", data).then(hexFromBuffer);
      }

      function panelSrcForLang() {
        /* electromarker clone: EN shell + FR shell */
        return lang === "fr" ? "electromarker/fr/index.html" : "electromarker/index.html";
      }

      function applyLang(next) {
        lang = normalizeLang(next);
        try {
          localStorage.setItem(LANG_STORAGE, lang);
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = t("meta.title");
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute("content", t("meta.desc"));
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        var errEl = document.getElementById("ecoleGateErr");
        if (errEl && !errEl.hidden) {
          errEl.textContent = t("err");
        }
        var brand = document.querySelector(".sim-brand");
        var home = lang === "fr" ? "index-fr.html" : "index.html";
        if (brand) brand.setAttribute("href", home);
        document.querySelectorAll("[data-edz-home]").forEach(function (a) {
          a.setAttribute("href", home);
        });
        document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
        });
        /* If already unlocked, refresh iframe locale when language changes */
        var frame = document.getElementById("simFrame");
        if (frame && document.body.classList.contains("ecole-unlocked")) {
          var nextSrc = panelSrcForLang();
          if (frame.getAttribute("src") !== nextSrc) {
            var loading = document.getElementById("simLoading");
            if (loading) loading.hidden = false;
            frame.src = nextSrc;
          }
        }
      }

      function openPanel() {
        var gate = document.getElementById("ecoleGate");
        var wrap = document.getElementById("simFrameWrap");
        var frame = document.getElementById("simFrame");
        var loading = document.getElementById("simLoading");
        var fsToggle = document.getElementById("simFsToggle");
        if (gate) gate.hidden = true;
        if (wrap) wrap.hidden = false;
        if (fsToggle) fsToggle.hidden = false;
        document.body.classList.add("ecole-unlocked");
        if (frame) {
          var src = panelSrcForLang();
          if (frame.getAttribute("src") !== src) {
            if (loading) loading.hidden = false;
            frame.src = src;
          }
        }
      }

      document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyLang(btn.getAttribute("data-lang"));
        });
      });

      var form = document.getElementById("ecoleGateForm");
      var codeInput = document.getElementById("ecoleCode");
      var errEl = document.getElementById("ecoleGateErr");
      var frame = document.getElementById("simFrame");
      var loading = document.getElementById("simLoading");

      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var code = normalizeCode(codeInput && codeInput.value);
          var enterBtn = document.getElementById("ecoleEnter");
          if (enterBtn) enterBtn.disabled = true;
          sha256Hex(code)
            .then(function (digest) {
              if (digest === ACCESS_CODE_SHA256) {
                if (errEl) errEl.hidden = true;
                setUnlocked();
                openPanel();
                return;
              }
              if (errEl) {
                errEl.textContent = t("err");
                errEl.hidden = false;
              }
              if (codeInput) {
                codeInput.value = "";
                codeInput.focus();
              }
            })
            .catch(function () {
              if (errEl) {
                errEl.textContent = t("err");
                errEl.hidden = false;
              }
            })
            .then(function () {
              if (enterBtn) enterBtn.disabled = false;
            });
        });
      }

      if (frame && loading) {
        frame.addEventListener("load", function () {
          loading.hidden = true;
        });
      }

      applyLang(lang);
      if (isUnlocked()) openPanel();
      else if (codeInput) codeInput.focus();
    })();
  </script>
  <script src="js/sim-fullscreen.js?v=20260917chrome1"></script>
  <script src="js/site-home-nav.js"></script>
</body>
</html>
