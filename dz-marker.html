<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="js/theme-electric-neon.js?v=chrome1"></script>
  <meta name="description" content="Électro Marker — éditeur d’étiquettes de tableaux électriques." />
  <meta name="robots" content="noindex, follow" />
  <title>Électro Marker — Electro DZ</title>
  <link rel="icon" href="assets/electro-marker-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/electro-marker-icon.png" />
  <link rel="stylesheet" href="css/simulation-swissdz.css?v=20260917chrome1" />
  <link rel="stylesheet" href="css/ecole-electricite.css?v=20261007-logo" />
  <link rel="canonical" href="https://electro-dz.com/dz-marker.html" />
  <style>
    /* Électro Marker cyan/noir (scoped; does not alter other ecole pages) */
    .dz-marker-frame { background: #0a0f1a; }
    body.ecole-page {
      --em-cyan: #00aeef;
      --em-ink: #0a0f1a;
    }
    .sim-brand .accent { color: #00aeef !important; }
    /* Entry header logo — clearly readable (was 32px / 22px mobile) */
    .sim-topbar {
      padding-top: max(10px, env(safe-area-inset-top, 0px));
      padding-bottom: 10px;
      min-height: 64px;
    }
    .sim-brand {
      font-size: 1.15rem;
      gap: 12px;
    }
    .sim-brand img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: contain;
      background: #0a0f1a;
      box-shadow: 0 0 0 1px rgba(0, 174, 239, 0.35);
    }
    .lang-btn.active {
      background: #00aeef !important;
      color: #061018 !important;
    }
    .edz-home-link {
      border-color: rgba(0, 174, 239, 0.45) !important;
      background: rgba(0, 174, 239, 0.12) !important;
      color: #7dd3fc !important;
    }
    @media (max-width: 640px) {
      .sim-topbar {
        min-height: 60px;
        padding-top: max(8px, env(safe-area-inset-top, 0px));
        padding-bottom: 8px;
      }
      .sim-brand {
        font-size: 1rem;
        gap: 10px;
      }
      .sim-brand img {
        width: 48px;
        height: 48px;
      }
    }
    @media (max-width: 380px) {
      /* Keep brand mark visible even when title text hides */
      .sim-brand > span { display: none; }
      .sim-brand img {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>
<body class="sim-page ecole-page ecole-unlocked">
  <header class="sim-topbar">
    <a href="index-fr.html" class="sim-brand" data-i18n-href-fr="index-fr.html" data-i18n-href-ar="index.html">
      <img src="assets/electro-marker-icon.png" alt="Électro Marker" width="56" height="56" decoding="async" />
      <span>Électro <span class="accent">Marker</span></span>
    </a>
    <a href="index-fr.html" class="edz-home-link" data-edz-home="1" data-i18n="nav.home">Accueil</a>
    <div class="sim-top-actions">
      <div class="sim-lang">
        <button type="button" class="lang-btn active" data-lang="fr" aria-label="Français">FR</button>
        <button type="button" class="lang-btn" data-lang="ar" aria-label="العربية">AR</button>
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
      </div>
      <button type="button" class="sim-fs-toggle" id="simFsToggle" aria-pressed="false" aria-controls="simFrameWrap">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm12 0h-2v3h-3v2h5v-5zM7 7h3V5H5v5h2V7zm12-2h-5v2h3v3h2V5z"/>
        </svg>
        <span class="sim-fs-enter" data-i18n="fs.enter">Plein écran</span>
        <span class="sim-fs-exit" data-i18n="fs.exit">Quitter</span>
      </button>
    </div>
  </header>

  <div class="sim-workspace ecole-workspace">
    <div class="sim-frame-wrap ecole-frame-wrap" id="simFrameWrap">
      <p class="sim-loading" id="simLoading" data-i18n="loading">Chargement d’Électro Marker…</p>
      <iframe
        id="simFrame"
        class="dz-marker-frame"
        title="Électro Marker — éditeur d’étiquettes"
        allow="fullscreen"
        allowfullscreen
        loading="eager"
      ></iframe>
      <button type="button" class="sim-fs-close" id="simFsClose">
        <span class="sim-fs-close-x" aria-hidden="true">×</span>
        <span data-i18n="fs.close">Fermer</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      var LANG_STORAGE = "electrodz-site-lang";

      var T = {
        fr: {
          "meta.title": "Électro Marker — Electro DZ",
          "meta.desc": "Électro Marker — éditeur d’étiquettes de tableaux électriques.",
          "nav.home": "Accueil",
          loading: "Chargement d’Électro Marker…",
          "fs.enter": "Plein écran",
          "fs.exit": "Quitter",
          "fs.close": "Fermer",
        },
        ar: {
          "meta.title": "Électro Marker — Electro DZ",
          "meta.desc": "Électro Marker — محرر ملصقات اللوحات الكهربائية.",
          "nav.home": "الرئيسية",
          loading: "جاري تحميل Électro Marker…",
          "fs.enter": "ملء الشاشة",
          "fs.exit": "خروج",
          "fs.close": "إغلاق",
        },
        en: {
          "meta.title": "Électro Marker — Electro DZ",
          "meta.desc": "Électro Marker — electrical panel label editor.",
          "nav.home": "Home",
          loading: "Loading Électro Marker…",
          "fs.enter": "Fullscreen",
          "fs.exit": "Exit",
          "fs.close": "Close",
        },
      };

      function normalizeLang(next) {
        return next === "fr" || next === "ar" || next === "en" ? next : "fr";
      }

      var lang = "fr";
      try {
        lang = normalizeLang(localStorage.getItem(LANG_STORAGE) || "");
      } catch (e) {}

      function t(k) {
        return (T[lang] && T[lang][k]) || T.fr[k] || k;
      }

      function panelSrcForLang() {
        /* Électro Marker: EN shell + FR shell */
        return lang === "fr" ? "dzmarker-app/fr/index.html" : "dzmarker-app/index.html";
      }

      function applyLang(next) {
        lang = normalizeLang(next);
        try {
          localStorage.setItem(LANG_STORAGE, lang);
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = t("meta.title");
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute("content", t("meta.desc"));
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        var brand = document.querySelector(".sim-brand");
        var home = lang === "fr" ? "index-fr.html" : "index.html";
        if (brand) brand.setAttribute("href", home);
        document.querySelectorAll("[data-edz-home]").forEach(function (a) {
          a.setAttribute("href", home);
        });
        document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
        });
        var frame = document.getElementById("simFrame");
        if (frame) {
          var nextSrc = panelSrcForLang();
          if (frame.getAttribute("src") !== nextSrc) {
            var loading = document.getElementById("simLoading");
            if (loading) loading.hidden = false;
            frame.src = nextSrc;
          }
        }
      }

      function openPanel() {
        var frame = document.getElementById("simFrame");
        var loading = document.getElementById("simLoading");
        document.body.classList.add("ecole-unlocked");
        if (frame) {
          var src = panelSrcForLang();
          if (frame.getAttribute("src") !== src) {
            if (loading) loading.hidden = false;
            frame.src = src;
          }
        }
      }

      document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyLang(btn.getAttribute("data-lang"));
        });
      });

      var frame = document.getElementById("simFrame");
      var loading = document.getElementById("simLoading");
      if (frame && loading) {
        frame.addEventListener("load", function () {
          loading.hidden = true;
        });
      }

      applyLang(lang);
      openPanel();
    })();
  </script>
  <script src="js/sim-fullscreen.js?v=20260917chrome1"></script>
  <script src="js/site-home-nav.js"></script>
</body>
</html>
