<!DOCTYPE html>
<html class="embed-meter">
<head>
  <base href="/oibt-trainer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fluke 1664 — embed PanelWire (face trainer authentique)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <title>SwissDZ · Fluke 1664 (embed)</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html.embed-meter, html.embed-meter body {
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    flutter-view, flt-glass-pane, flt-scene-host, flt-canvas-container {
      background: transparent !important;
      background-color: transparent !important;
      touch-action: none;
    }
    html.embed-meter flt-scene-host canvas,
    html.embed-meter canvas {
      background: transparent !important;
      background-color: transparent !important;
    }
  </style>
</head>
<body>
  <script>
  (function () {
    var u = new URL(window.location.href);
    if (!/(?:^|[?&])embed=1(?:&|$)/.test(u.search)) {
      u.searchParams.set("embed", "1");
    }
    if ((u.hash || "").toLowerCase().indexOf("/meter") === -1) {
      u.hash = "#/meter";
    }
    var target = u.pathname + "?" + u.searchParams.toString() + u.hash;
    if (target !== window.location.pathname + window.location.search + window.location.hash) {
      history.replaceState(null, "", target);
    }
    try {
      document.documentElement.style.background = "transparent";
      document.body.style.background = "transparent";
    } catch (_) {}
  })();
  </script>
  <!--
    Pont WireLab → Flutter (vrai LCD, pas d’overlay peint).
    - V~ : volts LN / LPE / NPE depuis le plan.
    - RISO live (≥30 V entre pointes) : prétest refuse (U>30V — RISO inhibé).
    - RISO mort (0 V) : MΩ ouvert honnête (>∞ / haut) si tips OK ; pas de modèle de défaut
      d’isolement dans le plan pour l’instant (riso optionnel dans le payload).
  -->
  <script>
  (function () {
    window.__wirelabFluke = {
      L: false, N: false, PE: false,
      volts: { LN: 0, LPE: 0, NPE: 0 },
      maxV: 0,
      live: false,
      riso: null,
      sim: false
    };
    function applyMsg(d) {
      if (!d || typeof d !== "object") return false;
      var t = d.type;
      if (t !== "wirelab-fluke-leads" && t !== "panelwire/fluke-state" && t !== "panelwire/fluke-measures") {
        return false;
      }
      var wl = window.__wirelabFluke;
      if (d.L != null || d.N != null || d.PE != null) {
        if (d.L != null) wl.L = !!d.L;
        if (d.N != null) wl.N = !!d.N;
        if (d.PE != null) wl.PE = !!d.PE;
      }
      if (d.leads && typeof d.leads === "object") {
        wl.L = !!d.leads.L;
        wl.N = !!d.leads.N;
        wl.PE = !!d.leads.PE;
      }
      var v = d.volts;
      if (v && typeof v === "object") {
        if (v.LN != null) wl.volts.LN = +v.LN || 0;
        if (v.LPE != null) wl.volts.LPE = +v.LPE || 0;
        if (v.NPE != null) wl.volts.NPE = +v.NPE || 0;
      }
      if (d.ln != null) wl.volts.LN = +d.ln || 0;
      if (d.lpe != null) wl.volts.LPE = +d.lpe || 0;
      if (d.npe != null) wl.volts.NPE = +d.npe || 0;
      wl.maxV = Math.max(wl.volts.LN, wl.volts.LPE, wl.volts.NPE);
      if (d.maxV != null) wl.maxV = Math.max(wl.maxV, +d.maxV || 0);
      wl.live = !!d.live || wl.maxV >= 30;
      if (d.riso != null && isFinite(+d.riso)) wl.riso = +d.riso;
      else if (d.riso === null) wl.riso = null;
      else if (!wl.live && (wl.L || wl.N || wl.PE)) wl.riso = null; /* moteur → ∞ ouvert */
      if (d.sim != null) wl.sim = !!d.sim;
      return true;
    }
    function refreshMeter() {
      var m = window.__wirelabFlukeMeter;
      if (!m) return;
      try {
        if (typeof m.mE === "function") m.mE();
      } catch (_) {}
    }
    window.addEventListener("message", function (ev) {
      if (!applyMsg(ev && ev.data)) return;
      refreshMeter();
    });
    /* Si le parent a déjà posté avant le boot Flutter. */
    var tries = 0;
    var boot = setInterval(function () {
      tries++;
      if (window.__wirelabFlukeMeter || tries > 80) {
        clearInterval(boot);
        refreshMeter();
      }
    }, 250);
  })();
  </script>
  <!-- Un seul canvas Flutter — pas de miroir alpha (évite le ghosting double Fluke). -->
  <script>
  (function () {
    function paintHost(root) {
      if (!root || root.getElementById("fluke-embed-trans")) return;
      var s = document.createElement("style");
      s.id = "fluke-embed-trans";
      s.textContent = "flt-scene-host,flt-canvas-container,canvas{background:transparent!important;background-color:transparent!important}";
      try { root.appendChild(s); } catch (_) {}
    }
    function scan() {
      document.querySelectorAll("flt-glass-pane").forEach(function (g) {
        paintHost(g.shadowRoot);
      });
    }
    var mo = new MutationObserver(scan);
    mo.observe(document.documentElement, { childList: true, subtree: true });
    scan();
    setTimeout(scan, 400);
    setTimeout(scan, 1500);
  })();
  </script>
  <script src="flutter_bootstrap.js?v=fluke-riso" async></script>
</body>
</html>
