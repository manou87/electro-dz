  <script>
  (function () {
    window.__wirelabFluke = {
      L: false, N: false, PE: false,
      volts: { LN: 0, LPE: 0, NPE: 0 },
      maxV: 0, live: false, riso: null,
      risoByPair: { LN: null, LPE: null, NPE: null },
      tipShortByPair: { LN: false, LPE: false, NPE: false },
      rcd: { present: false, closed: false, idnMa: 30, uid: null, peOk: false, liveOk: false },
      sim: false,
      earthOhm: null,
      earthMethod: null
    };
    function applyMsg(d) {
      if (!d || typeof d !== "object") return false;
      var t = d.type;
      if (t !== "wirelab-fluke-leads" && t !== "panelwire/fluke-state" &&
          t !== "panelwire/fluke-measures" && t !== "panelwire/fluke-test") return false;
      var wl = window.__wirelabFluke;
      if (d.L != null) wl.L = !!d.L;
      if (d.N != null) wl.N = !!d.N;
      if (d.PE != null) wl.PE = !!d.PE;
      if (d.leads && typeof d.leads === "object") {
        wl.L = !!d.leads.L; wl.N = !!d.leads.N; wl.PE = !!d.leads.PE;
      }
      var v = d.volts;
      if (v && typeof v === "object") {
        if (v.LN != null) wl.volts.LN = +v.LN || 0;
        if (v.LPE != null) wl.volts.LPE = +v.LPE || 0;
        if (v.NPE != null) wl.volts.NPE = +v.NPE || 0;
      }
      if (d.ln != null) wl.volts.LN = +d.ln || 0;
      if (d.lpe != null) wl.volts.LPE = +d.lpe || 0;
      if (d.npe != null) wl.volts.NPE = +d.npe || 0;
      wl.maxV = Math.max(wl.volts.LN, wl.volts.LPE, wl.volts.NPE);
      if (d.maxV != null) wl.maxV = Math.max(wl.maxV, +d.maxV || 0);
      wl.live = !!d.live || wl.maxV >= 30;
      if (d.risoByPair && typeof d.risoByPair === "object") {
        wl.risoByPair = {
          LN: (d.risoByPair.LN != null && isFinite(+d.risoByPair.LN)) ? +d.risoByPair.LN : null,
          LPE: (d.risoByPair.LPE != null && isFinite(+d.risoByPair.LPE)) ? +d.risoByPair.LPE : null,
          NPE: (d.risoByPair.NPE != null && isFinite(+d.risoByPair.NPE)) ? +d.risoByPair.NPE : null
        };
      }
      if (d.tipShortByPair && typeof d.tipShortByPair === "object") {
        wl.tipShortByPair = {
          LN: !!d.tipShortByPair.LN,
          LPE: !!d.tipShortByPair.LPE,
          NPE: !!d.tipShortByPair.NPE
        };
      }
      if (d.rcd && typeof d.rcd === "object") {
        wl.rcd = {
          present: !!d.rcd.present,
          closed: !!d.rcd.closed,
          idnMa: isFinite(+d.rcd.idnMa) ? +d.rcd.idnMa : 30,
          uid: d.rcd.uid || null,
          peOk: !!d.rcd.peOk,
          liveOk: !!d.rcd.liveOk
        };
      }
      if (d.riso != null && isFinite(+d.riso)) wl.riso = +d.riso;
      else if (d.riso === null) wl.riso = null;
      if (d.sim != null) wl.sim = !!d.sim;
      if (d.earthOhm != null && isFinite(+d.earthOhm)) wl.earthOhm = +d.earthOhm;
      else if (d.earthOhm === null) wl.earthOhm = null;
      if (d.earthMethod != null) wl.earthMethod = d.earthMethod;
      if (t === "panelwire/fluke-test") {
        runFlukeTest(d);
        return true;
      }
      return true;
    }
    function refreshMeter() {
      var m = window.__wirelabFlukeMeter;
      if (m && typeof m.mE === "function") { try { m.mE(); } catch (_) {} }
    }
    function runFlukeTest(d) {
      var m = window.__wirelabFlukeMeter;
      var wl = window.__wirelabFluke;
      if (!m) return;
      try {
        var method = (d && d.earthMethod) || wl.earthMethod || "p3_62";
        if (method === "loop_pe") {
          if (typeof m.__wlSetLoop === "function") m.__wlSetLoop();
        } else {
          if (typeof m.__wlSetEarth === "function") m.__wlSetEarth();
        }
      } catch (_) {}
      refreshMeter();
      try {
        if (typeof m.__wlTest === "function") m.__wlTest();
        else if (typeof m.adJ === "function") m.adJ();
        else if (typeof m.aoM === "function") m.aoM({ a: 0 });
      } catch (_) {}
    }
    window.__wirelabFlukeRunTest = runFlukeTest;
    window.addEventListener("message", function (ev) {
      if (!applyMsg(ev && ev.data)) return;
      refreshMeter();
    });
    var tries = 0;
    var boot = setInterval(function () {
      tries++;
      if (window.__wirelabFlukeMeter || tries > 80) { clearInterval(boot); refreshMeter(); }
    }, 250);
  })();
  </script>
  <script>
  (function () {
    function paintHost(root) {
      if (!root || root.getElementById("fluke-embed-trans")) return;
      var s = document.createElement("style");
      s.id = "fluke-embed-trans";
      s.textContent = "flt-scene-host,flt-canvas-container,canvas,flt-glass-pane,flutter-view{background:transparent!important;background-color:transparent!important;}";
      try { root.appendChild(s); } catch (_) {}

    function scan() {
      document.querySelectorAll("flt-glass-pane").forEach(function (g) { paintHost(g.shadowRoot); });
      paintHost(document.head);
    }
    var mo = new MutationObserver(scan);
    mo.observe(document.documentElement, { childList: true, subtree: true });
    scan();
    setTimeout(scan, 400);
    setTimeout(scan, 1500);
  })();
