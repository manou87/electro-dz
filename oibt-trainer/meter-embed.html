<!DOCTYPE html>
<html class="embed-meter">
<head>
  <base href="/oibt-trainer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fluke 1664 — embed PanelWire">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <title>SwissDZ · Fluke 1664 (embed)</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html.embed-meter, html.embed-meter body {
      background: transparent !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    flutter-view, flt-glass-pane, flt-scene-host {
      touch-action: none;
    }
    /* Réduit la letterbox noire autour du canvas (recadrage panel côté parent). */
    html.embed-meter flt-scene-host canvas {
      background-color: transparent !important;
    }
    #panelwire-measures {
      position: fixed; right: 6px; bottom: 6px; z-index: 99999;
      font: 600 11px/1.35 system-ui, sans-serif; color: #0f172a;
      background: rgba(255,255,255,.88); border: 1px solid rgba(148,163,184,.55);
      border-radius: 8px; padding: 6px 8px; pointer-events: none;
      box-shadow: 0 2px 8px rgba(15,23,42,.12);
      display: none;
    }
    #panelwire-measures.on { display: block; }
  </style>
</head>
<body>
  <script>
  (function () {
    var u = new URL(window.location.href);
    if (!/(?:^|[?&])embed=1(?:&|$)/.test(u.search)) {
      u.searchParams.set("embed", "1");
    }
    if ((u.hash || "").toLowerCase().indexOf("/meter") === -1) {
      u.hash = "#/meter";
    }
    var target = u.pathname + "?" + u.searchParams.toString() + u.hash;
    if (target !== window.location.pathname + window.location.search + window.location.hash) {
      history.replaceState(null, "", target);
    }
    try { document.body.style.background = "transparent"; } catch (_) {}
  })();
  </script>
  <div id="panelwire-measures" aria-live="polite"></div>
  <script>
  (function () {
    var hud = document.getElementById("panelwire-measures");
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.type !== "panelwire/fluke-measures") return;
      if (!hud) return;
      if (!d.sim) { hud.classList.remove("on"); return; }
      hud.classList.add("on");
      hud.textContent = "PanelWire · L–N " + (d.ln || 0) + " V · L–PE " + (d.lpe || 0) + " V";
    });
  })();
  </script>
  <script src="flutter_bootstrap.js?v=meter-embed-3" async></script>
</body>
</html>
