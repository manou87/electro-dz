  <meta charset="UTF-8">

<body>
  <script>
  // Évite un vieux service worker Flutter qui sert un ancien main.dart.js
  // (hard-refresh insuffisant pour le Labo / iframe).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((r) => r.unregister());
    });
  }
  if (window.caches) {
    caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
  }

  // Landscape lock (Android Chrome, souvent en fullscreen uniquement).
  // iOS Safari : API absente → overlay Flutter invite à tourner.
  function tryLockLandscape() {
    try {
      var o = screen.orientation || screen.mozOrientation || screen.msOrientation;
      if (o && typeof o.lock === 'function') {
        o.lock('landscape').catch(function () {});
      }
    } catch (_) {}
  }
  tryLockLandscape();
  document.addEventListener('fullscreenchange', tryLockLandscape);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tryLockLandscape();
  });
</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
