<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Bibliothèque officielle des symboles électriques Hager Normen — IEC 60617 — Electro DZ" />
  <meta name="robots" content="index, follow" />
  <title>Symboles Hager Normen — Electro DZ</title>
  <link rel="stylesheet" href="css/site-brand.css" />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="canonical" href="https://electro-dz.com/symboles-hager.html" />
  <style>
    .sym-page { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .sym-hero { margin-bottom: 1.5rem; }
    .sym-hero h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    .sym-hero p { color: #475569; margin: 0; line-height: 1.5; }
    .sym-toolbar { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.25rem 0; align-items: center; }
    .sym-toolbar input, .sym-toolbar select { padding: .5rem .75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .95rem; }
    .sym-toolbar input { flex: 1; min-width: 200px; }
    .sym-count { font-size: .85rem; color: #64748b; }
    .sym-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .75rem; }
    .sym-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: .6rem; background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .sym-card svg, .sym-card img { width: 56px; height: 56px; object-fit: contain; margin-bottom: .4rem; }
    .sym-card strong { font-size: .72rem; line-height: 1.25; color: #0f172a; font-weight: 600; }
    .sym-card span { font-size: .65rem; color: #64748b; margin-top: .2rem; }
    .sym-section { margin-top: 2rem; }
    .sym-section h2 { font-size: 1.1rem; border-bottom: 2px solid #1d4ed8; padding-bottom: .35rem; margin-bottom: 1rem; }
    .sym-canonical { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .75rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">Electro <span>DZ</span></a>
      <nav class="site-nav">
        <a href="calcul-electrique.html">Calculs</a>
        <a href="schemas-plans.html">Schémas</a>
        <a href="bibliotheque.html">Bibliothèque</a>
        <a href="symboles-hager.html" aria-current="page">Symboles Hager</a>
      </nav>
    </div>
  </header>

  <main class="sym-page">
    <div class="sym-hero">
      <h1>Symboles officiels Hager Normen</h1>
      <p>
        Base extraite du PDF <a href="pdf/hager-normen.pdf" target="_blank" rel="noopener">Hager Normen</a>
        (IEC 60617, NIBT 2020 / electrosuisse) — utilisée sur le schéma unifilaire et l’éditeur Electro DZ.
      </p>
    </div>

    <div class="sym-toolbar">
      <input type="search" id="symSearch" placeholder="Rechercher un symbole…" aria-label="Rechercher" />
      <select id="symCategory" aria-label="Catégorie">
        <option value="">Toutes catégories</option>
      </select>
      <select id="symPage" aria-label="Page PDF">
        <option value="">Toutes pages</option>
        <option value="5">Page 5 — Courants, commandes, contacts</option>
        <option value="6">Page 6 — Conducteurs, appareils</option>
        <option value="7">Page 7 — Machines, mesure, KNX</option>
        <option value="10">Page 10 — Planification BPK</option>
      </select>
      <span class="sym-count" id="symCount"></span>
    </div>

    <section class="sym-section">
      <h2>Symboles unifilaire (alias canoniques)</h2>
      <div class="sym-canonical" id="symCanonical"></div>
    </section>

    <section class="sym-section">
      <h2>Bibliothèque complète (<span id="symTotal">—</span> symboles)</h2>
      <div class="sym-grid" id="symGrid"></div>
    </section>
  </main>

  <script src="js/hager-symbols-official-data.js?v=20260607"></script>
  <script src="js/iec-symbol-library.js?v=20260607"></script>
  <script src="js/symboles-hager-page.js?v=20260607"></script>
</body>
</html>
