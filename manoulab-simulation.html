<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="js/theme-electric-neon.js?v=1794907227"></script>
  <meta name="description" content="ManouLab Simulation — Laboratoire virtuel de câblage industriel, multimètre à pince, moteurs 6 bornes & automates" />
  <meta name="robots" content="index, follow"/>
  <title>ManouLab Simulation — Câblage électrique & Pince multimètre | Electro DZ</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="stylesheet" href="css/simulation-swissdz.css?v=1794907227" />
  <link rel="canonical" href="https://electro-dz.com/manoulab-simulation.html" />
  <style>
    .sim-page {
      background: #0b1120;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
    }
    .sim-topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }
    .sim-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .sim-brand img { border-radius: 6px; }
    .sim-brand .accent { color: #facc15; }
    .sim-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sim-btn-full {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .sim-btn-full:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    .sim-frame-wrap {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px);
      position: relative;
    }
    .sim-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body class="sim-page">
  <header class="sim-topbar">
    <a href="index-fr.html" class="sim-brand">
      <img src="assets/app-icon.png" alt="" width="28" height="28" decoding="async" />
      <span>ManouLab <span class="accent">Simulation</span></span>
    </a>
    <div class="sim-actions">
      <button type="button" class="sim-btn-full" onclick="toggleFullScreen()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M7 14H5v5h5v-2H7v-3zm12 0h-2v3h-3v2h5v-5zM7 7h3V5H5v5h2V7zm12-2h-5v2h3v3h2V5z"/>
        </svg>
        <span>Plein écran</span>
      </button>
      <a href="index-fr.html" class="sim-btn-full" style="text-decoration: none;">
        <span>✕ Quitter</span>
      </a>
    </div>
  </header>

  <main class="sim-frame-wrap" id="simWrap">
    <iframe
      src="manoulab-sim/index.html?v=1794957911"
      title="ManouLab Simulation — Laboratoire virtuel de câblage industriel"
      allow="fullscreen"
      allowfullscreen
    ></iframe>
  </main>

  <script>
    function toggleFullScreen() {
      var elem = document.getElementById("simWrap");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
  </script>
</body>
</html>
