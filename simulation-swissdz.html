<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="js/theme-electric-neon.js"></script>
  <meta name="description" content="Simulateur SwissDZ — tableau électrique, atelier virtuel & schéma unifilaire professionnel" />
  <meta name="robots" content="index, follow"/>
  <title>Simulateur SwissDZ — tableau, atelier & unifilaire pro | Electro DZ</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="stylesheet" href="css/simulation-swissdz.css?v=20260630a" />
  <link rel="canonical" href="https://electro-dz.com/simulation-swissdz.html" />
</head>
<body class="sim-page">
  <header class="sim-topbar">
    <a href="index-fr.html" class="sim-brand" data-i18n-href-fr="index-fr.html" data-i18n-href-ar="index.html">
      <img src="assets/app-icon.png" alt="" width="32" height="32" decoding="async" />
      <span>Swiss<span class="accent">DZ</span></span>
    </a>
    <div class="sim-lang">
      <button type="button" class="lang-btn active" data-lang="fr" aria-label="Français">FR</button>
      <button type="button" class="lang-btn" data-lang="ar" aria-label="العربية">AR</button>
    </div>
  </header>

  <div class="sim-workspace">
    <nav class="sim-module-bar" role="tablist" aria-label="Modules du simulateur">
      <button type="button" class="sim-mod-btn active" data-mod="1">
        <span class="sim-mod-icon" aria-hidden="true">⚡</span>
        <span class="sim-mod-text">
          <span class="sim-mod-title" data-i18n="mod.tableau">Tableau</span>
          <span class="sim-mod-desc" data-i18n="mod.tableau.desc">Glissez vos disjoncteurs · unifilaire en 1 clic</span>
        </span>
      </button>
      <button type="button" class="sim-mod-btn" data-mod="3">
        <span class="sim-mod-icon" aria-hidden="true">🔧</span>
        <span class="sim-mod-text">
          <span class="sim-mod-title" data-i18n="mod.ar">Atelier</span>
          <span class="sim-mod-desc" data-i18n="mod.ar.desc">Câblage virtuel · scénarios pro & débutant</span>
        </span>
      </button>
    </nav>
    <div class="sim-frame-wrap">
      <p class="sim-loading" id="simLoading" data-i18n="loading">Chargement du simulateur…</p>
      <iframe
        id="simFrame"
        src="simulation-swissdz/index.html?embed=1&m=1"
        title="Simulateur SwissDZ — tableau, atelier & unifilaire professionnel"
        allow="fullscreen"
        loading="eager"
      ></iframe>
    </div>
    <p class="sim-footer-note" data-i18n="footer">
      Outil pédagogique SwissDZ — NFC 15-100 · IEC 60364. Toute installation réelle doit être vérifiée par un professionnel habilité.
    </p>
  </div>

  <script>
    (function () {
      var STORAGE = "electrodz-site-lang";
      var T = {
        fr: {
          "meta.title": "Simulateur SwissDZ — tableau, atelier & unifilaire pro | Electro DZ",
          "meta.desc": "Simulateur SwissDZ — tableau électrique, atelier virtuel & schéma unifilaire professionnel.",
          loading: "Chargement du simulateur…",
          footer: "SwissDZ · NFC 15-100 · IEC 60364. Toute installation réelle doit être vérifiée par un professionnel habilité.",
          "mod.tableau": "Tableau",
          "mod.tableau.desc": "Glissez vos disjoncteurs · unifilaire en 1 clic",
          "mod.ar": "Atelier",
          "mod.ar.desc": "Câblage virtuel · scénarios pro & débutant",
        },
        ar: {
          "meta.title": "محاكي SwissDZ — لوحة، ورشة ومخطط أحادي احترافي | Electro DZ",
          "meta.desc": "محاكي SwissDZ — لوحة كهربائية، ورشة افتراضية ومخطط أحادي الطور احترافي.",
          loading: "جاري تحميل المحاكي…",
          footer: "SwissDZ · NFC 15-100 · IEC 60364. أي تركيب حقيقي يجب أن يتحقق منه مختص مؤهل.",
          "mod.tableau": "لوحة",
          "mod.tableau.desc": "اسحب القواطع · مخطط أحادي بضغطة واحدة",
          "mod.ar": "ورشة",
          "mod.ar.desc": "تمديدات افتراضية · سيناريوهات احترافية ومبتدئة",
        },
      };

      var lang = localStorage.getItem(STORAGE) === "fr" ? "fr" : "ar";
      if (document.documentElement.lang === "fr") lang = "fr";

      function t(k) {
        return (T[lang] && T[lang][k]) || T.fr[k] || k;
      }

      function applyLang(next) {
        lang = next === "fr" ? "fr" : "ar";
        localStorage.setItem(STORAGE, lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = t("meta.title");
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute("content", t("meta.desc"));
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        var brand = document.querySelector(".sim-brand");
        if (brand) brand.setAttribute("href", lang === "fr" ? "index-fr.html" : "index.html");
        document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
        });
      }

      document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyLang(btn.getAttribute("data-lang"));
        });
      });

      var frame = document.getElementById("simFrame");
      var loading = document.getElementById("simLoading");
      var activeMod = "1";
      var frameReady = false;

      function prefetchAtelier() {
        fetch("simulation-swissdz/evc-lib/manifest.json", { cache: "force-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (data) {
              try { sessionStorage.setItem("evc-manifest", JSON.stringify(data)); } catch (e) {}
            }
          })
          .catch(function () {});
      }

      if ("requestIdleCallback" in window) {
        requestIdleCallback(prefetchAtelier);
      } else {
        setTimeout(prefetchAtelier, 1500);
      }

      function loadModule(mod) {
        activeMod = mod;
        document.querySelectorAll(".sim-mod-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-mod") === mod);
        });
        if (frameReady && frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: "swissdz-set-module", mod: mod }, "*");
          return;
        }
        if (loading) loading.hidden = false;
        if (frame) frame.src = "simulation-swissdz/index.html?embed=1&m=" + mod;
      }

      document.querySelectorAll(".sim-mod-btn").forEach(function (btn) {
        var mod = btn.getAttribute("data-mod");
        if (mod === "3") {
          btn.addEventListener("mouseenter", prefetchAtelier, { once: true });
          btn.addEventListener("focus", prefetchAtelier, { once: true });
        }
        btn.addEventListener("click", function () {
          loadModule(mod);
        });
      });

      if (frame && loading) {
        frame.addEventListener("load", function () {
          frameReady = true;
          loading.hidden = true;
        });
      }

      applyLang(lang);
    })();
  </script>
</body>
</html>
