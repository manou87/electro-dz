<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <title>Lecteur PDF — DZSWISS ELEC</title>
  <link rel="stylesheet" href="css/lecteur-pdf.css" />
</head>
<body>
  <header class="reader-header">
    <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>←</a>
    <h1 id="doc-title">PDF</h1>
    <button type="button" class="lang-btn active" data-lang="fr">FR</button>
    <button type="button" class="lang-btn" data-lang="ar">AR</button>
    <button type="button" class="btn" id="btn-favorite" title="Favoris" aria-label="Favoris">☆</button>
    <a href="#" class="btn btn-primary" id="btn-download" download data-i18n="download">↓</a>
  </header>

  <div class="reader-toolbar" id="reader-toolbar" hidden aria-label="Outils lecteur">
    <div class="toolbar-group" aria-label="Historique pages">
      <button type="button" class="btn" id="btn-hist-back" title="Retour" aria-label="Page précédente (historique)">↩</button>
      <button type="button" class="btn" id="btn-hist-fwd" title="Avancer" aria-label="Page suivante (historique)">↪</button>
    </div>
    <div class="toolbar-group" aria-label="Zoom">
      <button type="button" class="btn" id="btn-zoom-out" title="Zoom −" aria-label="Zoom arrière">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" class="btn" id="btn-zoom-in" title="Zoom +" aria-label="Zoom avant">+</button>
      <button type="button" class="btn" id="btn-fit-width" data-i18n="fitWidth" title="Ajuster largeur">Largeur</button>
      <button type="button" class="btn" id="btn-fit-page" data-i18n="fitPage" title="Ajuster page">Page</button>
    </div>
    <div class="toolbar-group" aria-label="Annotation">
      <button type="button" class="btn tool-active" id="btn-tool-hand" data-i18n="toolHand" title="Déplacer">✋</button>
      <button type="button" class="btn" id="btn-tool-pen" data-i18n="toolPen" title="Stylo">✎</button>
      <button type="button" class="btn" id="btn-tool-highlight" data-i18n="toolHighlight" title="Surligneur">🖍</button>
      <button type="button" class="btn" id="btn-tool-eraser" data-i18n="toolEraser" title="Gomme">⌫</button>
      <input type="color" class="tool-color" id="ink-color" value="#ef4444" title="Couleur" aria-label="Couleur du stylo" />
      <input type="range" class="tool-size" id="ink-size" min="1" max="12" value="3" title="Épaisseur" aria-label="Épaisseur du trait" />
      <button type="button" class="btn" id="btn-clear-ink" data-i18n="clearInk" title="Effacer tout">🗑</button>
    </div>
    <div class="toolbar-group">
      <button type="button" class="btn" id="btn-rotate" data-i18n="rotate" title="Rotation 90°">↻</button>
      <button type="button" class="btn" id="btn-fullscreen" data-i18n="fullscreen" title="Plein écran">⛶</button>
    </div>
  </div>

  <div class="reader-loading" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text" data-i18n="loading">Chargement…</p>
  </div>

  <div class="reader-error" id="error" hidden>
    <p data-i18n="error">Impossible d’afficher ce PDF.</p>
    <div class="btn-row">
      <a href="#" class="btn btn-primary" id="btn-open-fallback" target="_blank" rel="noopener noreferrer" data-i18n="openExternal">Ouvrir le PDF</a>
      <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>←</a>
    </div>
  </div>

  <div class="reader-body" id="reader-body" hidden>
    <p class="mode-hint" id="mode-hint" data-i18n="swipeHint">Pincement = zoom · Glisser = déplacer · Stylo = annoter</p>
    <div class="reader-stage-wrap" id="stage-wrap">
      <div class="reader-stage" id="pdf-stage"></div>
    </div>
    <nav class="pdf-pager" id="pdf-pager" aria-label="Navigation pages">
      <button type="button" class="btn btn-nav prev" id="btn-prev" aria-label="Page précédente">‹</button>
      <span class="page-info" id="page-info">1 / 1</span>
      <button type="button" class="btn btn-nav next" id="btn-next" aria-label="Page suivante">›</button>
      <label class="page-jump">
        <span data-i18n="goto">Page</span>
        <input type="number" id="page-input" min="1" value="1" aria-label="Numéro de page" />
      </label>
    </nav>
  </div>

  <script src="js/site-config.js"></script>
  <script src="js/oauth-return.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/pdf-stats.js"></script>
  <script src="js/user-favorites.js"></script>
  <script src="js/pdf.min.js"></script>
  <script src="js/library-protected.js"></script>
  <script src="js/lecteur-pdf.js"></script>
</body>
</html>
