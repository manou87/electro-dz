<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Lecteur PDF — DZSWISS ELEC</title>
  <style>
    :root{
      --bg:#0f172a;
      --surface:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.1);
      --accent:#facc15;
      --text:#e2e8f0;
      --muted:#94a3b8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
    .reader-header{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:10px 16px;border-bottom:1px solid var(--border);
      background:rgba(15,23,42,0.95);backdrop-filter:blur(10px);
      position:sticky;top:0;z-index:10;
    }
    .reader-header h1{
      flex:1;min-width:120px;font-size:.95rem;font-weight:700;line-height:1.3;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .btn{
      display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;
      font-size:.78rem;font-weight:700;text-decoration:none;border:1px solid var(--border);
      background:var(--surface);color:var(--text);cursor:pointer;
    }
    .btn-primary{background:var(--accent);color:#0f172a;border-color:var(--accent)}
    .btn:hover{opacity:.92}
    .lang-btn{background:none;border:1px solid var(--muted);color:var(--muted);padding:3px 8px;border-radius:5px;font-weight:700;font-size:.68rem;cursor:pointer}
    .lang-btn.active{background:var(--accent);color:#0f172a;border-color:var(--accent)}
    .reader-main{position:relative;height:calc(100vh - 52px);height:calc(100dvh - 52px);background:#1a1a1a}
    .reader-frame{width:100%;height:100%;border:0;display:block;background:#525659}
    .reader-loading,.reader-error{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
      background:var(--bg);z-index:2;
    }
    .reader-loading[hidden],.reader-error[hidden]{display:none}
    .spinner{
      width:40px;height:40px;border:3px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .reader-error p{color:var(--muted);max-width:420px;font-size:.9rem}
    html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,sans-serif}
  </style>
</head>
<body>
  <header class="reader-header">
    <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>← Bibliothèque</a>
    <h1 id="doc-title">PDF</h1>
    <button type="button" class="lang-btn active" data-lang="fr">FR</button>
    <button type="button" class="lang-btn" data-lang="ar">AR</button>
    <a href="#" class="btn btn-primary" id="btn-download" download data-i18n="download">Télécharger</a>
  </header>

  <main class="reader-main">
    <div class="reader-loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="loading">Chargement du document…</p>
    </div>
    <div class="reader-error" id="error" hidden>
      <p data-i18n="error">Impossible d’afficher ce PDF ici. Vérifiez votre connexion ou réessayez.</p>
      <a href="bibliotheque.html" class="btn btn-primary" data-i18n="back" data-back-link>← Bibliothèque</a>
    </div>
    <iframe class="reader-frame" id="pdf-frame" title="PDF" hidden></iframe>
  </main>

  <script src="js/lecteur-pdf.js"></script>
</body>
</html>
