<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <title>Lecteur PDF — DZSWISS ELEC</title>
  <style>
    :root{
      --bg:#0f172a;
      --surface:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.1);
      --accent:#facc15;
      --text:#e2e8f0;
      --muted:#94a3b8;
      --header-h:52px;
      --pager-h:56px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
    .reader-header{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:8px 12px;height:var(--header-h);
      border-bottom:1px solid var(--border);
      background:rgba(15,23,42,0.98);
    }
    .reader-header h1{
      flex:1;min-width:80px;font-size:.88rem;font-weight:700;line-height:1.25;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:4px;
      padding:6px 10px;border-radius:8px;
      font-size:.75rem;font-weight:700;text-decoration:none;border:1px solid var(--border);
      background:var(--surface);color:var(--text);cursor:pointer;min-height:34px;
    }
    .btn-primary{background:var(--accent);color:#0f172a;border-color:var(--accent)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .lang-btn{background:none;border:1px solid var(--muted);color:var(--muted);padding:3px 7px;border-radius:5px;font-weight:700;font-size:.65rem;cursor:pointer;min-height:auto}
    .lang-btn.active{background:var(--accent);color:#0f172a;border-color:var(--accent)}
    .reader-body{
      display:flex;flex-direction:column;
      height:calc(100vh - var(--header-h));
      height:calc(100dvh - var(--header-h));
    }
    .reader-stage-wrap{
      flex:1;min-height:0;overflow:auto;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y pinch-zoom;
      background:#525659;
      display:flex;align-items:flex-start;justify-content:center;
      padding:10px 8px;
    }
    .reader-stage{
      width:100%;max-width:920px;display:flex;justify-content:center;
    }
    .reader-stage canvas{
      display:block;max-width:100%;height:auto;
      background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.45);
    }
    .pdf-pager{
      flex-shrink:0;height:var(--pager-h);
      display:flex;align-items:center;justify-content:center;gap:12px;
      padding:8px 16px;
      background:rgba(15,23,42,0.98);
      border-top:1px solid var(--border);
    }
    .pdf-pager .btn-nav{
      width:44px;height:44px;padding:0;border-radius:50%;
      font-size:1.4rem;line-height:1;font-weight:700;
    }
    .pdf-pager .page-info{
      font-size:.9rem;font-weight:800;color:var(--accent);
      min-width:100px;text-align:center;
    }
    .pdf-pager .page-jump{
      display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);
    }
    .pdf-pager input[type="number"]{
      width:52px;padding:6px 4px;border-radius:6px;border:1px solid var(--border);
      background:rgba(255,255,255,.08);color:var(--text);font-weight:700;text-align:center;
    }
    .reader-loading,.reader-error{
      position:fixed;inset:0;top:var(--header-h);z-index:20;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;padding:24px;text-align:center;background:var(--bg);
    }
    .reader-loading[hidden],.reader-error[hidden],.pdf-pager[hidden],.reader-body[hidden]{display:none!important}
    .spinner{
      width:40px;height:40px;border:3px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .reader-error p{color:var(--muted);max-width:400px;font-size:.88rem;line-height:1.5}
    .reader-error .btn-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
    .mode-hint{font-size:.7rem;color:var(--muted);text-align:center;padding:4px 12px 0}
    html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,sans-serif}
    html[dir="rtl"] .pdf-pager .btn-nav.prev::after{content:'›'}
    html[dir="rtl"] .pdf-pager .btn-nav.next::after{content:'‹'}
  </style>
</head>
<body>
  <header class="reader-header">
    <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>←</a>
    <h1 id="doc-title">PDF</h1>
    <button type="button" class="lang-btn active" data-lang="fr">FR</button>
    <button type="button" class="lang-btn" data-lang="ar">AR</button>
    <a href="#" class="btn btn-primary" id="btn-download" download data-i18n="download">↓</a>
  </header>

  <div class="reader-loading" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text" data-i18n="loading">Chargement…</p>
  </div>

  <div class="reader-error" id="error" hidden>
    <p data-i18n="error">Impossible d’afficher ce PDF.</p>
    <div class="btn-row">
      <a href="#" class="btn btn-primary" id="btn-open-fallback" target="_blank" rel="noopener noreferrer" data-i18n="openExternal">Ouvrir le PDF</a>
      <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>←</a>
    </div>
  </div>

  <div class="reader-body" id="reader-body" hidden>
    <p class="mode-hint" id="mode-hint" data-i18n="swipeHint">Glissez ou utilisez les flèches pour changer de page</p>
    <div class="reader-stage-wrap" id="stage-wrap">
      <div class="reader-stage" id="pdf-stage"></div>
    </div>
    <nav class="pdf-pager" id="pdf-pager" aria-label="Navigation pages">
      <button type="button" class="btn btn-nav prev" id="btn-prev" aria-label="Page précédente">‹</button>
      <span class="page-info" id="page-info">1 / 1</span>
      <button type="button" class="btn btn-nav next" id="btn-next" aria-label="Page suivante">›</button>
      <label class="page-jump">
        <span data-i18n="goto">Aller</span>
        <input type="number" id="page-input" min="1" value="1" aria-label="Numéro de page" />
      </label>
    </nav>
  </div>

  <script src="js/pdf.min.js"></script>
  <script src="js/lecteur-pdf.js"></script>
</body>
</html>
