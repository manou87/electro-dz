<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <title>Lecteur PDF — DZSWISS ELEC</title>
  <style>
    :root{
      --bg:#0f172a;
      --surface:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.1);
      --accent:#facc15;
      --text:#e2e8f0;
      --muted:#94a3b8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
    .reader-header{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:10px 16px;border-bottom:1px solid var(--border);
      background:rgba(15,23,42,0.95);backdrop-filter:blur(10px);
      position:sticky;top:0;z-index:10;
    }
    .reader-header h1{
      flex:1;min-width:120px;font-size:.95rem;font-weight:700;line-height:1.3;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .page-indicator{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}
    .btn{
      display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;
      font-size:.78rem;font-weight:700;text-decoration:none;border:1px solid var(--border);
      background:var(--surface);color:var(--text);cursor:pointer;
    }
    .btn-primary{background:var(--accent);color:#0f172a;border-color:var(--accent)}
    .btn:hover{opacity:.92}
    .lang-btn{background:none;border:1px solid var(--muted);color:var(--muted);padding:3px 8px;border-radius:5px;font-weight:700;font-size:.68rem;cursor:pointer}
    .lang-btn.active{background:var(--accent);color:#0f172a;border-color:var(--accent)}
    .reader-main{
      position:relative;
      height:calc(100vh - 52px);
      height:calc(100dvh - 52px);
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      background:#525659;
    }
    .pdf-pages{
      display:flex;flex-direction:column;align-items:center;
      gap:12px;padding:12px 8px 32px;min-height:100%;
    }
    .pdf-pages[hidden]{display:none!important}
    .pdf-page{width:100%;max-width:920px;display:flex;justify-content:center}
    .pdf-page canvas{
      display:block;max-width:100%;height:auto;
      background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.4);
    }
    .reader-frame{width:100%;min-height:100%;border:0;display:block;background:#525659}
    .reader-frame[hidden]{display:none!important}
    .reader-loading,.reader-error{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
      background:var(--bg);z-index:2;
    }
    .reader-loading[hidden],.reader-error[hidden]{display:none!important}
    .spinner{
      width:40px;height:40px;border:3px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .reader-error p{color:var(--muted);max-width:420px;font-size:.9rem;line-height:1.5}
    .reader-error .btn-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
    html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,sans-serif}
  </style>
</head>
<body>
  <header class="reader-header">
    <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>← Bibliothèque</a>
    <h1 id="doc-title">PDF</h1>
    <span class="page-indicator" id="page-indicator" hidden></span>
    <button type="button" class="lang-btn active" data-lang="fr">FR</button>
    <button type="button" class="lang-btn" data-lang="ar">AR</button>
    <a href="#" class="btn btn-primary" id="btn-download" download data-i18n="download">Télécharger</a>
    <a href="#" class="btn" id="btn-open-external" target="_blank" rel="noopener noreferrer" data-i18n="openExternal" hidden>Ouvrir</a>
  </header>

  <main class="reader-main" id="reader-scroll">
    <div class="reader-loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text" data-i18n="loading">Chargement du document…</p>
    </div>
    <div class="reader-error" id="error" hidden>
      <p data-i18n="error">Impossible d’afficher ce PDF ici. Vérifiez votre connexion ou réessayez.</p>
      <div class="btn-row">
        <a href="#" class="btn btn-primary" id="btn-open-fallback" target="_blank" rel="noopener noreferrer" data-i18n="openExternal">Ouvrir le PDF</a>
        <a href="bibliotheque.html" class="btn" data-i18n="back" data-back-link>← Bibliothèque</a>
      </div>
    </div>
    <div class="pdf-pages" id="pdf-pages" hidden></div>
    <iframe class="reader-frame" id="pdf-frame" title="PDF" hidden></iframe>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/lecteur-pdf.js"></script>
</body>
</html>
