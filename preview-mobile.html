<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Test mobile — Simulation SwissDz</title>
  <style>
    * { box-sizing: border-box; }

      margin: 0;

      color: #e8eaee;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px 24px;

    img {
      width: min(280px, 80vw);
      height: auto;
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }
    code {
      display: block;
      word-break: break-all;
      font-size: 0.75rem;
      background: #14161b;
      border: 1px solid #32363f;
      border-radius: 8px;
      padding: 10px;
      margin-top: 16px;
