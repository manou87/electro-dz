<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <script src="js/theme-electric-neon.js"></script>
  <meta name="description" id="meta-desc" content="DZSWISS ELEC - عروض أسعار كهربائية"/>
  <title>عروض الأسعار | DZSWISS ELEC</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png"/>
  <link rel="stylesheet" href="css/site-brand.css"/>
  <style>
    :root{--primary:#facc15;--bg:#0f172a;--surface:rgba(255,255,255,0.04);--text:#e2e8f0;--muted:#94a3b8;--danger:#f87171}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:15px 5%;background:rgba(15,23,42,0.9);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
    .logo{color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:12px}
    .nav-links{display:flex;gap:24px;list-style:none;flex-wrap:wrap}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;font-weight:600}
    .nav-links a:hover,.nav-links a.active{color:var(--primary)}
    .hero{text-align:center;padding:40px 5% 20px;max-width:900px;margin:0 auto}
    .hero h1{font-size:2rem;font-weight:900;color:#fff}
    .hero p{color:var(--muted);margin-top:8px;font-size:0.95rem}
    .container{max-width:1100px;margin:0 auto;padding:0 5% 60px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
    .btn{background:var(--primary);color:#0f172a;border:none;padding:10px 16px;border-radius:8px;font-weight:800;cursor:pointer;font-size:0.9rem}
    .btn--ghost{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.12)}
    .btn--danger{background:rgba(248,113,113,0.15);color:var(--danger);border:1px solid rgba(248,113,113,0.35)}
    .panel{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;margin-bottom:16px}
    .panel h2{font-size:1.1rem;color:var(--primary);margin-bottom:14px;font-weight:800}
    .devis-list{display:grid;gap:12px}
    .devis-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);cursor:pointer;transition:.2s}
    .devis-card:hover{border-color:var(--primary)}
    .devis-card strong{color:#fff;display:block}
    .devis-card small{color:var(--muted)}
    .devis-card .amount{color:var(--primary);font-weight:800;white-space:nowrap}
    .empty{text-align:center;color:var(--muted);padding:40px 20px}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
    label{font-size:0.82rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
    input,textarea{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 12px;border-radius:8px;color:#fff;font-size:1rem;outline:none;width:100%}
    input:focus,textarea:focus{border-color:var(--primary)}
    .items-table{width:100%;border-collapse:collapse;font-size:0.88rem}
    .items-table th,.items-table td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.08);text-align:start;vertical-align:middle}
    .items-table th{color:var(--muted);font-weight:700;font-size:0.78rem}
    .items-table input{padding:6px 8px;font-size:0.88rem}
    .items-table .col-qty,.items-table .col-price{width:90px}
    .items-table .col-total{width:100px;text-align:end;color:var(--primary);font-weight:700}
    .items-table .btn-row{background:none;border:none;color:var(--danger);cursor:pointer;font-size:1.1rem;padding:4px}
    .totals-row{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(250,204,21,0.35)}
    .totals-row strong{font-size:1.25rem;color:var(--primary)}
    .catalog-search{width:100%;margin-bottom:10px}
    .catalog-meta{font-size:0.85rem;color:var(--muted);margin-bottom:12px;line-height:1.4}
    .catalog-filters-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
    .cat-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .cat-chip{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--muted);cursor:pointer;font-size:0.78rem;font-weight:700;line-height:1.25;text-align:start;max-width:100%}
    .cat-chip.active{background:var(--primary);color:#0f172a;border-color:var(--primary)}
    .cat-chip .cat-chip-count{display:block;font-size:0.68rem;font-weight:600;opacity:0.9;margin-top:3px}
    .catalog-table-wrap{border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.15)}
    .catalog-table-head{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 48px;gap:8px;padding:10px 12px;font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08)}
    .catalog-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 48px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
    .catalog-row:last-child{border-bottom:none}
    .catalog-row-desc{font-size:0.82rem;line-height:1.35;color:var(--text);word-break:break-word}
    .catalog-inp-qty,.catalog-inp-price{width:100%;padding:8px 6px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:0.9rem;text-align:center}
    .catalog-inp-qty:focus,.catalog-inp-price:focus{border-color:var(--primary);outline:none}
    .catalog-add-btn{width:44px;height:40px;border:none;border-radius:8px;background:var(--primary);color:#0f172a;font-weight:900;font-size:1.25rem;cursor:pointer;line-height:1}
    .catalog-add-btn:active{transform:scale(0.96)}
    .cat-block{border-top:1px solid rgba(255,255,255,0.06)}
    .cat-block:first-child{border-top:none}
    .cat-head{display:flex;align-items:center;gap:8px;padding:12px;background:rgba(255,255,255,0.03);cursor:pointer;font-weight:700;font-size:0.88rem}
    .cat-head .cat-chevron{flex-shrink:0;color:var(--primary);font-size:0.75rem;width:1.2em}
    .cat-head .cat-title{flex:1;min-width:0;line-height:1.3}
    .cat-head .cat-count{flex-shrink:0;color:var(--primary);font-size:0.8rem;font-variant-numeric:tabular-nums}
    .cat-body{display:none}
    .cat-block.open .cat-body{display:block}
    .cat-block.open .cat-chevron{transform:rotate(90deg)}
    html[dir="rtl"] .cat-block.open .cat-chevron{transform:rotate(-90deg)}
    .cat-hint{font-size:0.8rem;color:var(--muted);margin-bottom:10px;padding:0 4px;line-height:1.4}
    .edit-layout{display:flex;flex-direction:column;gap:16px}
    .lang-switcher{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.show{display:flex}
    .modal{background:#1e293b;border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
    .modal h3{color:var(--primary);margin-bottom:16px}
    .modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
    .hidden{display:none!important}
    .co-logo-section{margin:16px 0;text-align:center}
    .co-logo-preview{width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);display:none;margin:0 auto 10px}
    .co-logo-preview.visible{display:block}
    .co-logo-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .co-logo-toggle{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer;font-size:0.9rem}
    .co-logo-toggle input{width:18px;height:18px;accent-color:var(--primary)}
    .co-logo-hint{font-size:0.78rem;color:var(--muted);margin:6px 0 0;line-height:1.35}
    @media(max-width:768px){.nav-links{display:none}.items-table{font-size:0.8rem}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">
      <img src="assets/app-icon.png" alt="" class="logo-img" width="44" height="44" decoding="async"/>
      <div style="line-height:1.2">
        <div style="font-weight:900;display:block">DZSWISS ELEC</div>
        <small id="brand-tagline" style="display:block;font-size:0.55rem;color:#94a3b8;font-weight:600;margin-top:2px"></small>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="navHome"></a></li>
      <li><a href="formations.html" data-i18n="navFormations"></a></li>
      <li><a href="documentation.html" data-i18n="navDocs"></a></li>
      <li><a href="calcul-electrique.html" data-i18n="navCalc"></a></li>
      <li><a href="devis.html" class="active" data-i18n="navDevis"></a></li>
    </ul>
    <button class="lang-switcher" type="button" id="lang-toggle">FR</button>
  </nav>

  <header class="hero">
    <h1 id="hero-title"></h1>
    <p id="hero-sub"></p>
    <p id="saved-count" style="color:var(--primary);font-weight:700;margin-top:6px;font-size:0.9rem"></p>
  </header>

  <div class="container">
    <div id="view-list">
      <div class="toolbar">
        <button type="button" class="btn" id="btn-new" data-i18n="btnNew"></button>
        <button type="button" class="btn btn--ghost" id="btn-company" data-i18n="btnCompany"></button>
      </div>
      <div class="panel">
        <div id="devis-list" class="devis-list"></div>
      </div>
    </div>

    <div id="view-edit" class="hidden">
      <div class="toolbar">
        <button type="button" class="btn btn--ghost" id="btn-back" data-i18n="btnBack"></button>
        <button type="button" class="btn" id="btn-save" data-i18n="btnSave"></button>
        <button type="button" class="btn btn--ghost" id="btn-print" data-i18n="btnPrint"></button>
        <button type="button" class="btn btn--danger" id="btn-delete" data-i18n="btnDelete"></button>
      </div>

      <div class="edit-layout">
        <div>
          <div class="panel">
            <h2 data-i18n="clientName"></h2>
            <div class="form-grid">
              <div>
                <label data-i18n="clientName"></label>
                <input id="client-name" type="text" autocomplete="name"/>
              </div>
              <div>
                <label data-i18n="clientPhone"></label>
                <input id="client-phone" type="tel" autocomplete="tel"/>
              </div>
              <div style="grid-column:1/-1">
                <label data-i18n="clientAddress"></label>
                <input id="client-address" type="text"/>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2 data-i18n="itemsTitle"></h2>
            <div style="overflow-x:auto">
              <table class="items-table">
                <thead>
                  <tr>
                    <th data-i18n="printColDesc"></th>
                    <th class="col-qty" data-i18n="qty"></th>
                    <th class="col-price" data-i18n="unitPrice"></th>
                    <th class="col-total" data-i18n="lineTotal"></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="items-tbody"></tbody>
              </table>
            </div>
            <button type="button" class="btn btn--ghost" id="btn-custom" style="margin-top:12px" data-i18n="addCustom"></button>
            <div class="totals-row">
              <span data-i18n="total"></span>
              <strong id="edit-total">0 DZD</strong>
            </div>
          </div>
        </div>

        <div class="panel catalog-panel">
          <h2 data-i18n="catalogTitle"></h2>
          <p class="catalog-meta" id="catalog-meta"></p>
          <input class="catalog-search" id="catalog-search" type="search" data-i18n-placeholder="searchPlaceholder"/>
          <p class="catalog-filters-label" data-i18n="catalogCategories"></p>
          <div class="cat-grid" id="cat-strip"></div>
          <p class="cat-hint hidden" id="cat-hint" data-i18n="catalogExpandHint"></p>
          <div class="catalog-table-wrap">
            <div class="catalog-table-head">
              <span data-i18n="catalogColArticle"></span>
              <span data-i18n="qty"></span>
              <span data-i18n="unitPrice"></span>
              <span data-i18n="catalogColAdd"></span>
            </div>
            <div id="catalog-root"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer style="text-align:center;padding:40px;color:var(--muted)"><p data-i18n="footerCopy"></p></footer>

  <div class="modal-overlay" id="modal-company" aria-hidden="true">
    <div class="modal" role="dialog">
      <h3 data-i18n="companyTitle"></h3>
      <div class="form-grid" style="grid-template-columns:1fr">
        <div><label data-i18n="companyName"></label><input id="co-name" type="text"/></div>
        <div><label data-i18n="companyServices"></label><input id="co-services" type="text"/></div>
        <div><label data-i18n="companyPhone"></label><input id="co-phone" type="tel"/></div>
        <div><label data-i18n="companyEmail"></label><input id="co-email" type="email"/></div>
        <div class="co-logo-section">
          <label data-i18n="companyLogo"></label>
          <p class="co-logo-hint" data-i18n="companyLogoHint"></p>
          <img id="co-logo-preview" class="co-logo-preview" alt="" width="112" height="112"/>
          <input type="file" id="co-logo-file" accept="image/*" class="hidden"/>
          <div class="co-logo-actions">
            <button type="button" class="btn btn--ghost" id="co-logo-pick" data-i18n="companyLogoChoose"></button>
            <button type="button" class="btn btn--ghost hidden" id="co-logo-remove" data-i18n="companyLogoRemove"></button>
          </div>
          <label class="co-logo-toggle">
            <input type="checkbox" id="co-show-logo"/>
            <span data-i18n="companyLogoShow"></span>
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" id="co-close" data-i18n="btnClose"></button>
        <button type="button" class="btn" id="co-save" data-i18n="btnSaveCompany"></button>
      </div>
    </div>
  </div>

  <script src="js/site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/devis-catalog.js"></script>
  <script src="js/devis-i18n.js"></script>
  <script src="js/visitor-counter.js"></script>
  <script src="js/devis.js" defer></script>
</body>
</html>
