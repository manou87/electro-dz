<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="js/theme-electric-neon.js"></script>
  <meta name="robots" content="noindex" />
  <meta name="description" content="اختبار ندوة 19 سبتمبر 2026 — première vérification و mesures OIBT. دخول برمز." />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="stylesheet" href="css/quiz-seminaire.css" />
  <title>اختبار الندوة 19 سبتمبر | SwissDZ</title>
  <link rel="canonical" href="https://electro-dz.com/quiz-seminaire.html" />
</head>
<body>
  <nav class="nav">
    <a class="logo" href="index.html">
      <img src="assets/app-icon.png" alt="" width="36" height="36" />
      <span>SwissDZ</span>
    </a>
    <a href="index.html#evenement-19-septembre">الرئيسية</a>
  </nav>
  <main class="wrap">
    <section id="gate" class="on">
      <h1>اختبار الندوة — 19 سبتمبر 2026</h1>
      <p class="lead">أسئلة بالعربية، والمصطلحات التقنية بالفرنسية. الدخول برمز القاعة فقط.</p>
      <div class="card">
        <label for="code">رمز الدخول</label>
        <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="••••••" />
        <button type="button" id="enter">دخول</button>
        <p class="err" id="gate-err" hidden></p>
      </div>
    </section>

    <section id="quiz">
      <p class="progress" id="progress"></p>
      <div class="card">
        <p class="q" id="qtext"></p>
        <div id="opts"></div>
        <div class="why" id="why" hidden></div>
        <p class="src" id="src"></p>
        <button type="button" id="next" hidden>التالي</button>
      </div>
    </section>

    <section id="done">
      <h1>انتهى الاختبار</h1>
      <p class="score" id="score"></p>
      <p class="lead" id="score-msg"></p>
      <div class="card">
        <p>بدون <span class="fr">appareil de mesure</span>، الـ <span class="fr">défaut</span> يبقى تخمين. مع <span class="fr">mesure</span>، يصبح دليل في <span class="fr">le rapport de sécurité</span>.</p>
        <a class="btn" href="index.html#evenement-19-septembre">العودة إلى الحدث</a>
        <button type="button" id="retry" class="btn-ghost">إعادة المحاولة</button>
      </div>
    </section>
  </main>
  <script src="js/quiz-evenement-19-septembre.js"></script>
</body>
</html>
