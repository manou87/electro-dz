<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    /* Si ce wrapper est lui-même dans une iframe du même wrapper,
       aller directement à Flutter (évite chrome doublé oibt-trainer.html vs oibt-trainer/). */
    (function () {
      if (window === window.top) return;
      try {
        var parentPath = window.parent.location.pathname || "";
        if (!/oibt-trainer\.html$/i.test(parentPath) && !/\/oibt-trainer\/?$/.test(parentPath)) return;
      } catch (e) {
        return;
      }
      var path = location.pathname || "/";
      if (/\/oibt-trainer\/index\.html$/i.test(path)) return;
      var dir = path.replace(/\/[^/]*$/, "/");
      if (dir.slice(-1) !== "/") dir += "/";
      var lang = "fr";
      try {
        var s = localStorage.getItem("electrodz-site-lang");
        if (s === "fr" || s === "ar" || s === "en") lang = s;
      } catch (e) {}
      var meter = (location.hash || "").toLowerCase().indexOf("meter") !== -1;
      location.replace(dir + "oibt-trainer/index.html?embed=1&lang=" + lang + (meter ? "#/meter" : "#/trainer"));
    })();
  </script>
  <script src="js/theme-electric-neon.js?v=chrome1"></script>
  <meta name="description" content="Electrical inspection training — panel, outlets and multifunction tester | Electro DZ" />
  <title>Entraînement au contrôle électrique | Electro DZ</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="preload" href="oibt-trainer/flutter_bootstrap.js?v=re1" as="script">
  <link rel="preload" href="oibt-trainer/main.dart.js?v=re1" as="script">
  <link rel="stylesheet" href="css/simulation-swissdz.css?v=20260917chrome1" />
  <link rel="canonical" href="https://electro-dz.com/oibt-trainer.html" />
</head>
<body class="sim-page">
  <div id="oibtIntro" class="sim-intro" hidden>
    <img
      class="sim-intro__photo"
      src="assets/section-previews/oibt-access-slide.webp"
      alt=""
      width="1920"
      height="1080"
      decoding="async"
    />
    <div class="sim-intro__scrim"></div>
    <div class="sim-intro__copy">
      <p class="sim-intro__kicker" data-i18n="intro.kicker">Entraînement au contrôle électrique</p>
      <h1 class="sim-intro__title" data-i18n="intro.title">Accès sans code</h1>
      <p class="sim-intro__text" data-i18n="intro.text">Jusqu’au 25/09/2026, le simulateur s’ouvre exclusivement sans code.</p>
      <button type="button" class="sim-intro__ok" id="oibtIntroOk" data-i18n="intro.ok">Continuer</button>
    </div>
  </div>

  <header class="sim-topbar" id="simTopbar">
    <a href="index-fr.html" class="sim-brand" data-i18n-href-fr="index-fr.html" data-i18n-href-ar="index.html">
      <img src="assets/app-icon.png" alt="" width="32" height="32" decoding="async" />
      <span>Swiss<span class="accent">DZ</span></span>
    </a>
    <a href="index-fr.html" class="edz-home-link" data-edz-home="1" data-i18n="nav.home">Accueil</a>
    <div class="sim-top-actions">
      <div class="sim-lang">
        <button type="button" class="lang-btn active" data-lang="fr" aria-label="Français">FR</button>
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
        <button type="button" class="lang-btn" data-lang="ar" aria-label="العربية">AR</button>
      </div>
      <button type="button" class="sim-fs-toggle" id="simFsToggle" aria-pressed="false" aria-controls="simFrameWrap">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm12 0h-2v3h-3v2h5v-5zM7 7h3V5H5v5h2V7zm12-2h-5v2h3v3h2V5z"/>
        </svg>
        <span class="sim-fs-enter" data-i18n="fs.enter">Plein écran</span>
        <span class="sim-fs-exit" data-i18n="fs.exit">Quitter</span>
      </button>
    </div>
  </header>

  <div class="sim-workspace">
    <div class="sim-frame-wrap" id="simFrameWrap">
      <p class="sim-loading" id="simLoading" data-i18n="loading">Chargement du simulateur…</p>
      <iframe
        id="simFrame"
        title="OIBT trainer"
        allow="fullscreen"
        allowfullscreen
        loading="eager"
      ></iframe>
      <button type="button" class="sim-fs-close" id="simFsClose">
        <span class="sim-fs-close-x" aria-hidden="true">×</span>
        <span data-i18n="fs.close">Fermer</span>
      </button>
    </div>
    <p class="sim-footer-note" data-i18n="footer">
      Outil pédagogique OIBT / NIV. Toute installation réelle doit être vérifiée par un inspecteur habilité.
    </p>
  </div>

  <script src="js/site-config.js?v=oibt-free25"></script>
  <script>
    (function () {
      var STORAGE = "electrodz-site-lang";
      var INTRO_DONE_KEY = "edz-oibt-intro-done";
      var FREE_UNTIL = (window.ElectroDzSite && window.ElectroDzSite.oibtFreeUntil) || "2026-09-25";
      var T = {
        fr: {
          "meta.title": "Entraînement au contrôle électrique | Electro DZ",
          "meta.desc": "Entraînement au contrôle d'installations — tableau, prises et testeur multifonction.",
          loading: "Chargement du simulateur…",
          "nav.home": "Accueil",
          footer: "Outil pédagogique OIBT / NIV. Toute installation réelle doit être vérifiée par un inspecteur habilité.",
          "intro.kicker": "Entraînement au contrôle électrique",
          "intro.title": "Accès sans code",
          "intro.text": "Jusqu’au 25/09/2026, le simulateur s’ouvre exclusivement sans code.",
          "intro.ok": "Continuer",
          "fs.enter": "Plein écran",
          "fs.exit": "Quitter",
          "fs.close": "Fermer",
        },
        ar: {
          "meta.title": "تدريب على المراقبة الكهربائية | Electro DZ",
          "meta.desc": "تدريب على مراقبة التركيبات — لوحة، مقابس وجهاز اختبار متعدد الوظائف.",
          loading: "جاري تحميل المحاكي…",
          "nav.home": "الرئيسية",
          footer: "أداة تعليمية OIBT / NIV. أي تركيب حقيقي يجب أن يتحقق منه مفتش مؤهل.",
          "intro.kicker": "تدريب على المراقبة الكهربائية",
          "intro.title": "دخول بدون رمز",
          "intro.text": "حتى 25/09/2026، يُفتح المحاكي بدون رمز دخول.",
          "intro.ok": "متابعة",
          "fs.enter": "ملء الشاشة",
          "fs.exit": "خروج",
          "fs.close": "إغلاق",
        },
        en: {
          "meta.title": "Electrical inspection training | Electro DZ",
          "meta.desc": "Electrical inspection training — distribution board, outlets and multifunction tester.",
          loading: "Loading the trainer…",
          "nav.home": "Home",
          footer: "Training tool — OIBT / NIV. Any live installation must be verified by a qualified inspector.",
          "intro.kicker": "Electrical inspection training",
          "intro.title": "Access without a code",
          "intro.text": "Until 25/09/2026, the simulator opens without an access code.",
          "intro.ok": "Continue",
          "fs.enter": "Fullscreen",
          "fs.exit": "Exit",
          "fs.close": "Close",
        },
      };

      function normalizeLang(next) {
        return next === "fr" || next === "ar" || next === "en" ? next : "fr";
      }
      var lang = "fr";
      try {
        lang = normalizeLang(localStorage.getItem(STORAGE) || "");
      } catch (e) {}

      function t(k) {
        return (T[lang] && T[lang][k]) || T.fr[k] || k;
      }

      function isFreeUntil() {
        // Date locale inclusive : libre tant que YYYY-MM-DD <= FREE_UNTIL (ex. 2026-09-25).
        var m = String(FREE_UNTIL).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return false;
        var now = new Date();
        var yyyy = now.getFullYear();
        var mm = now.getMonth() + 1;
        var dd = now.getDate();
        var ly = Number(m[1]);
        var lm = Number(m[2]);
        var ld = Number(m[3]);
        return yyyy < ly || (yyyy === ly && (mm < lm || (mm === lm && dd <= ld)));
      }

      function isMeterRoute() {
        return (location.hash || "").toLowerCase().indexOf("meter") !== -1;
      }

      function introAlreadyDone() {
        try {
          return sessionStorage.getItem(INTRO_DONE_KEY) === "1";
        } catch (e) {
          return false;
        }
      }

      function markIntroDone() {
        try {
          sessionStorage.setItem(INTRO_DONE_KEY, "1");
        } catch (e) {}
      }

      function shouldShowIntro() {
        if (!isFreeUntil() || isMeterRoute() || introAlreadyDone()) return false;
        return true;
      }

      function routeHash() {
        var h = (location.hash || "").toLowerCase();
        if (h.indexOf("meter") !== -1) return "#/meter";
        return "#/trainer";
      }

      function childDir() {
        var path = location.pathname || "/";
        var dir = path.replace(/\/[^/]*$/, "/");
        return dir.slice(-1) === "/" ? dir : dir + "/";
      }

      function frameSrc() {
        /* Chemin depuis le dossier de la page — évite que
           « oibt-trainer/index.html » soit résolu en oibt-trainer.html. */
        return childDir() + "oibt-trainer/index.html?embed=1&lang=" + lang + routeHash();
      }

      var frame = document.getElementById("simFrame");
      var loading = document.getElementById("simLoading");
      var intro = document.getElementById("oibtIntro");
      var introOk = document.getElementById("oibtIntroOk");
      var frameReady = false;

      function loadFrame() {
        if (!frame || frameReady) return;
        frameReady = true;
        if (loading) loading.hidden = false;
        frame.src = frameSrc();
      }

      function hideIntroWritings() {
        document.body.classList.remove("is-oibt-intro");
        if (!intro) return;
        intro.hidden = true;
        intro.setAttribute("aria-hidden", "true");
        intro.setAttribute("inert", "");
      }

      function showSimulator() {
        hideIntroWritings();
        loadFrame();
      }

      function showIntro() {
        document.body.classList.add("is-oibt-intro");
        if (!intro) return;
        intro.hidden = false;
        intro.removeAttribute("aria-hidden");
        intro.removeAttribute("inert");
        /* Précharge Flutter derrière la slide (sinon ça ne part qu’après Continuer). */
        loadFrame();
      }

      function applyLang(next) {
        lang = normalizeLang(next);
        try { localStorage.setItem(STORAGE, lang); } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = t("meta.title");
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute("content", t("meta.desc"));
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        var home = lang === "fr" ? "index-fr.html" : "index.html";
        document.querySelectorAll(".sim-brand, [data-edz-home]").forEach(function (el) {
          el.setAttribute("href", home);
        });
        document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
        });
        if (frameReady && frame) {
          if (loading) loading.hidden = false;
          frame.src = frameSrc();
        }
      }

      document.querySelectorAll(".sim-lang .lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyLang(btn.getAttribute("data-lang"));
        });
      });

      window.addEventListener("hashchange", function () {
        if (shouldShowIntro() && !frameReady) {
          showIntro();
          return;
        }
        showSimulator();
      });

      if (frame && loading) {
        frame.addEventListener("load", function () {
          loading.hidden = true;
        });
      }

      if (introOk) {
        introOk.addEventListener("click", function () {
          markIntroDone();
          showSimulator();
        });
      }

      applyLang(lang);
      if (shouldShowIntro()) showIntro();
      else showSimulator();
    })();
  </script>
  <script src="js/sim-fullscreen.js?v=20260917chrome1"></script>
</body>
</html>
