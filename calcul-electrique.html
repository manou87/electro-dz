<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" id="meta-desc" content="DZSWISS ELEC - حسابات كهربائية مهنية"/>
  <title>الحسابات الكهربائية | DZSWISS ELEC</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png"/>
  <link rel="stylesheet" href="css/site-brand.css"/>
  <style>
    :root{--primary:#facc15;--bg:#0f172a;--surface:rgba(255,255,255,0.04);--text:#e2e8f0;--muted:#94a3b8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:15px 5%;background:rgba(15,23,42,0.9);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
    .logo{color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:12px}
    .nav-links{display:flex;gap:32px;list-style:none}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:0.95rem;font-weight:600}
    .nav-links a:hover,.nav-links a.active{color:var(--primary)}
    .hero{text-align:center;padding:50px 5% 24px;max-width:900px;margin:0 auto}
    .hero h1{font-size:2.2rem;font-weight:900;color:#fff}
    .hero p{color:var(--muted);margin-top:8px}
    .container{max-width:960px;margin:0 auto;padding:0 5% 60px}
    .picker-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .picker-toolbar-label{font-size:0.85rem;color:var(--muted);font-weight:600}
    .picker-mode-btns{display:flex;gap:8px}
    .picker-mode-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.85rem}
    .picker-mode-btn.active{background:var(--primary);color:#0f172a;border-color:var(--primary)}
    .types-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .type-card{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:0.2s}
    .type-card:hover,.type-card.selected{border-color:var(--primary);background:rgba(250,204,21,0.08)}
    .type-card .type-icon{width:36px;height:36px;border-radius:10px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
    .type-card .type-name{font-size:0.78rem;font-weight:700;color:#fff;line-height:1.3}
    .types-strip{display:none;overflow-x:auto;gap:8px;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
    .types-strip .type-chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid rgba(255,255,255,0.1);cursor:pointer;white-space:nowrap;font-size:0.85rem;font-weight:600;color:var(--muted)}
    .types-strip .type-chip.active{background:var(--primary);color:#0f172a;border-color:var(--primary)}
    body.picker-compact .types-grid{display:none}
    body.picker-compact .types-strip{display:flex}
    body.calc-focus .types-picker-panel{display:none}
    body.calc-focus .focus-bar{display:flex}
    .focus-bar{display:none;align-items:center;gap:10px;margin-bottom:16px}
    .focus-expand{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:700;white-space:nowrap}
    .focus-chips{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch}
    .focus-chip{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem}
    .focus-chip.active{width:auto;padding:0 14px;gap:6px;background:var(--primary);border-color:var(--primary);color:#0f172a;font-weight:700;font-size:0.8rem}
    .calc-workspace{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px 24px}
    .calc-workspace-title{font-size:1.35rem;font-weight:800;color:var(--primary);margin-bottom:20px}
    .calc-section{display:none}
    .calc-section.active{display:block}
    .sub-type-selector{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .sub-type-btn{flex:1;min-width:90px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--muted);font-weight:700;cursor:pointer;font-size:0.9rem}
    .sub-type-btn.active{background:var(--primary);color:#0f172a;border-color:var(--primary)}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    .input-group{display:flex;flex-direction:column;gap:6px}
    .input-group.full{grid-column:1/-1}
    label{font-size:0.85rem;color:var(--muted);font-weight:600}
    input,select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:12px 14px;border-radius:8px;color:#fff;font-size:1rem;outline:none;width:100%}
    input:focus,select:focus{border-color:var(--primary)}
    .voltage-selector{display:flex;gap:10px}
    .voltage-btn{flex:1;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--muted);cursor:pointer;text-align:center}
    .voltage-btn.active{background:rgba(250,204,21,0.15);border-color:var(--primary);color:var(--primary)}
    .voltage-btn small{display:block;font-size:0.7rem;margin-top:2px;opacity:0.8}
    .balance-row{display:grid;grid-template-columns:1fr 1fr 70px 70px 70px;gap:8px;align-items:end;margin-bottom:10px}
    .btn-calc{background:var(--primary);color:#0f172a;border:none;padding:14px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:24px;width:100%;font-size:1.05rem}
    .result-box{margin-top:20px;padding:18px;background:rgba(250,204,21,0.05);border:1px dashed var(--primary);border-radius:12px;text-align:center;font-size:1.1rem;font-weight:700;color:var(--primary);min-height:60px}
    .calc-help{margin-top:24px;padding:16px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
    .calc-help h4{font-size:0.9rem;color:var(--primary);margin-bottom:6px}
    .calc-help p{font-size:0.85rem;color:var(--muted);line-height:1.5}
    .lang-switcher{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
    [data-ohm-group],[data-power-group],[data-brk-group]{display:none}
    [data-ohm-group].show,[data-power-group].show,[data-brk-group].show{display:contents}
    select.std-select{font-weight:600}
    .tc-canvas{width:100%;height:540px;background:#0b1424;border:1px solid rgba(255,255,255,0.08);border-radius:12px;margin-top:8px;display:block}
    .tc-legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;min-height:30px}
    .tc-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid;font-size:0.82rem;font-weight:600;color:#fff}
    .tc-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
    .tc-role{font-size:0.66rem;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:0.3px;text-transform:uppercase}
    .tc-role-amont{background:#1d4ed8;color:#fff}
    .tc-role-aval{background:#059669;color:#fff}
    .tc-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;padding:0 0 0 2px}
    .tc-x:hover{color:#f87171}
    .tc-note{font-size:0.75rem;color:var(--muted);margin-top:10px;line-height:1.5}
    .tc-verdict{margin:6px 0 2px;padding:12px 14px;border-radius:10px;font-size:0.9rem;font-weight:600;line-height:1.5;display:none}
    .tc-verdict.show{display:block}
    .tc-verdict.total{background:rgba(74,222,128,0.1);border:1px solid #4ade80;color:#4ade80}
    .tc-verdict.partial{background:rgba(250,204,21,0.1);border:1px solid #facc15;color:#facc15}
    .tc-verdict.warn{background:rgba(248,113,113,0.1);border:1px solid #f87171;color:#f87171}
    .tc-verdict small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
    .tc-pro-bar{margin:10px 0 0}
    .tc-pro-toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--primary);background:rgba(56,189,248,0.08);color:var(--primary);font-weight:700;cursor:pointer;font-size:0.88rem}
    .tc-pro-toggle.active{background:var(--primary);color:#0f172a}
    .tc-pro{margin-top:12px;padding:14px;border:1px dashed rgba(56,189,248,0.4);border-radius:12px;background:rgba(56,189,248,0.04)}
    .tc-pro[hidden]{display:none}
    .tc-disclaimer{font-size:0.78rem;line-height:1.5;color:#fbbf24;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.35);border-radius:8px;padding:10px 12px;margin:0 0 14px}
    .tc-pro-result{margin-top:10px;display:flex;flex-direction:column;gap:8px}
    .tc-pro-line{padding:10px 12px;border-radius:8px;font-size:0.85rem;font-weight:600;line-height:1.4;border:1px solid}
    .tc-pro-line.ok{background:rgba(74,222,128,0.1);border-color:#4ade80;color:#4ade80}
    .tc-pro-line.bad{background:rgba(248,113,113,0.12);border-color:#f87171;color:#f87171}
    .tc-pro-line.info{background:rgba(148,163,184,0.1);border-color:rgba(148,163,184,0.4);color:var(--muted)}
    .tc-export{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .tc-mini-btn{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.05);color:#e2e8f0;font-weight:600;cursor:pointer;font-size:0.82rem}
    .tc-mini-btn:hover{border-color:var(--primary);color:var(--primary)}
    @media(max-width:768px){.nav-links{display:none}.types-grid{grid-template-columns:repeat(2,1fr)}.balance-row{grid-template-columns:1fr 1fr}.tc-canvas{height:420px}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">
      <img src="assets/app-icon.png" alt="" class="logo-img" width="40" height="40" decoding="async"/>
      <div style="line-height:1.2">
        <div style="font-weight:900">DZSWISS ELEC</div>
        <small id="brand-tagline" style="display:block;font-size:0.55rem;color:#94a3b8;font-weight:600;margin-top:2px"></small>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="navHome"></a></li>
      <li><a href="formations.html" data-i18n="navFormations"></a></li>
      <li><a href="documentation.html" data-i18n="navDocs"></a></li>
      <li><a href="calcul-electrique.html" class="active" data-i18n="navCalc"></a></li>
    </ul>
    <button class="lang-switcher" type="button" id="lang-toggle">FR</button>
  </nav>

  <header class="hero">
    <h1 id="hero-title"></h1>
    <p id="hero-tagline" style="color:#facc15;font-weight:700;font-size:0.95rem;margin:6px 0 2px"></p>
    <p id="hero-surprise" style="color:#94a3b8;font-size:0.82rem;font-style:italic;margin:0 0 8px"></p>
    <p id="hero-sub"></p>
  </header>

  <div class="container">
    <div class="types-picker-panel" id="types-picker-panel">
      <div class="picker-toolbar">
        <span class="picker-toolbar-label" id="picker-label"></span>
        <div class="picker-mode-btns">
          <button type="button" class="picker-mode-btn active" data-picker="grid" id="picker-grid"></button>
          <button type="button" class="picker-mode-btn" data-picker="compact" id="picker-compact"></button>
        </div>
      </div>
      <div class="types-grid" id="types-grid"></div>
      <div class="types-strip" id="types-strip"></div>
    </div>

    <div class="focus-bar" id="focus-bar">
      <button type="button" class="focus-expand" id="focus-expand"></button>
      <div class="focus-chips" id="focus-chips"></div>
    </div>

    <div class="calc-workspace">
      <h2 class="calc-workspace-title" id="calc-active-title"></h2>

      <div id="ohm" class="calc-section active" data-calc="ohm_law">
        <div class="sub-type-selector">
          <button type="button" class="sub-type-btn active" data-ohm-sub="voltage" data-i18n="ohmSub_voltage"></button>
          <button type="button" class="sub-type-btn" data-ohm-sub="current" data-i18n="ohmSub_current"></button>
          <button type="button" class="sub-type-btn" data-ohm-sub="resistance" data-i18n="ohmSub_resistance"></button>
        </div>
        <input type="hidden" id="ohm-mode" value="voltage">
        <div class="form-grid">
          <div data-ohm-group="voltage" class="show">
            <div class="input-group"><label data-i18n="labelCurrent"></label><select id="ohm-i2" class="std-select" data-std="breaker" data-default="10"></select></div>
            <div class="input-group"><label data-i18n="labelResistance"></label><input type="number" id="ohm-r2" data-i18n-placeholder="phResistance"></div>
          </div>
          <div data-ohm-group="current">
            <div class="input-group"><label data-i18n="labelPower"></label><input type="number" id="ohm-p" data-i18n-placeholder="phPower"></div>
            <div class="input-group full"><label data-i18n="labelVoltage"></label>
              <div class="voltage-selector" data-voltage-target="ohm-u2">
                <button type="button" class="voltage-btn active" data-v="230">230V<small data-i18n="voltageMono"></small></button>
                <button type="button" class="voltage-btn" data-v="400">400V<small data-i18n="voltageTri"></small></button>
              </div>
              <input type="hidden" id="ohm-u2" value="230">
            </div>
            <div class="input-group"><label data-i18n="labelCosPhi"></label><input type="number" id="ohm-cos2" value="1" step="0.01"></div>
          </div>
          <div data-ohm-group="resistance">
            <div class="input-group full"><label data-i18n="labelVoltage"></label>
              <div class="voltage-selector" data-voltage-target="ohm-u3">
                <button type="button" class="voltage-btn active" data-v="230">230V<small data-i18n="voltageMono"></small></button>
                <button type="button" class="voltage-btn" data-v="400">400V<small data-i18n="voltageTri"></small></button>
              </div>
              <input type="hidden" id="ohm-u3" value="230">
            </div>
            <div class="input-group"><label data-i18n="labelCurrent"></label><select id="ohm-i3" class="std-select" data-std="breaker" data-default="10"></select></div>
          </div>
        </div>
      </div>

      <div id="power" class="calc-section" data-calc="power_energy">
        <div class="sub-type-selector">
          <button type="button" class="sub-type-btn active" data-power-sub="power" data-i18n="powerSub_power"></button>
          <button type="button" class="sub-type-btn" data-power-sub="energy" data-i18n="powerSub_energy"></button>
        </div>
        <input type="hidden" id="power-mode" value="power">
        <div class="form-grid">
          <div data-power-group="power" class="show">
            <div class="input-group"><label data-i18n="labelCurrent"></label><select id="power-i" class="std-select" data-std="breaker" data-default="10"></select></div>
            <div class="input-group full"><label data-i18n="labelVoltage"></label>
              <div class="voltage-selector" data-voltage-target="power-u">
                <button type="button" class="voltage-btn active" data-v="230">230V<small data-i18n="voltageMono"></small></button>
                <button type="button" class="voltage-btn" data-v="400">400V<small data-i18n="voltageTri"></small></button>
              </div>
              <input type="hidden" id="power-u" value="230">
            </div>
            <div class="input-group"><label data-i18n="labelCosPhi"></label><input type="number" id="power-cos" value="1" step="0.01"></div>
          </div>
          <div data-power-group="energy">
            <div class="input-group"><label data-i18n="labelPower"></label><input type="number" id="pe-p" data-i18n-placeholder="phEnergyP"></div>
            <div class="input-group"><label data-i18n="labelTime"></label><input type="number" id="pe-t" data-i18n-placeholder="phEnergyT"></div>
          </div>
        </div>
      </div>

      <div id="copper" class="calc-section" data-calc="copper_resistance">
        <div class="form-grid">
          <div class="input-group"><label data-i18n="labelLength"></label><input type="number" id="copper-l"></div>
          <div class="input-group"><label data-i18n="labelSection"></label><select id="copper-s" class="std-select" data-std="section" data-default="2.5"></select></div>
          <div class="input-group"><label data-i18n="labelTemp"></label><input type="number" id="copper-t" value="20"></div>
        </div>
      </div>

      <div id="drop" class="calc-section" data-calc="voltage_drop">
        <div class="form-grid">
          <div class="input-group"><label data-i18n="labelCurrentI"></label><select id="drop-i" class="std-select" data-std="ib" data-default="32"></select></div>
          <div class="input-group"><label data-i18n="labelLength"></label><input type="number" id="drop-l"></div>
          <div class="input-group"><label data-i18n="labelSection"></label><select id="drop-s" class="std-select" data-std="section" data-default="6"></select></div>
          <div class="input-group full"><label data-i18n="labelVoltage"></label>
            <div class="voltage-selector" data-voltage-target="drop-u">
              <button type="button" class="voltage-btn active" data-v="230">230V</button>
              <button type="button" class="voltage-btn" data-v="400">400V</button>
            </div>
            <input type="hidden" id="drop-u" value="230">
          </div>
          <div class="input-group"><label data-i18n="labelConductor"></label>
            <select id="drop-conductor" data-i18n-select="conductor"><option value="Cu" data-i18n-opt="conductorCu"></option><option value="Al" data-i18n-opt="conductorAl"></option></select>
          </div>
        </div>
      </div>

      <div id="section" class="calc-section" data-calc="cable_section">
        <div class="form-grid">
          <div class="input-group"><label data-i18n="labelCurrentIb"></label><select id="section-i" class="std-select" data-std="ib" data-default="32"></select></div>
          <div class="input-group"><label data-i18n="labelLength"></label><input type="number" id="section-l" data-i18n-placeholder="phLength"></div>
          <div class="input-group full"><label data-i18n="labelVoltage"></label>
            <div class="voltage-selector" data-voltage-target="section-u">
              <button type="button" class="voltage-btn active" data-v="230">230V</button>
              <button type="button" class="voltage-btn" data-v="400">400V</button>
            </div>
            <input type="hidden" id="section-u" value="230">
          </div>
          <div class="input-group"><label data-i18n="labelCosPhi"></label><input type="number" id="section-cos" value="0.85" step="0.01"></div>
          <div class="input-group"><label data-i18n="labelTemp"></label><input type="number" id="section-temp" value="30"></div>
          <div class="input-group"><label data-i18n="labelCircuits"></label><input type="number" id="section-circuits" value="1" min="1"></div>
          <div class="input-group"><label data-i18n="labelConductor"></label><select id="section-conductor" data-i18n-select="conductor"><option value="Cu" data-i18n-opt="conductorCu"></option><option value="Al" data-i18n-opt="conductorAl"></option></select></div>
          <div class="input-group"><label data-i18n="labelInsulation"></label><select id="section-insulation"><option value="PVC">PVC</option><option value="XLPE">XLPE</option><option value="PR">PR</option><option value="EPR">EPR</option></select></div>
          <div class="input-group"><label data-i18n="labelInstallMethod"></label>
            <select id="section-method"><option value="B1" selected>B1</option><option value="A1">A1</option><option value="A2">A2</option><option value="B2">B2</option><option value="C">C</option><option value="D1">D1</option><option value="D2">D2</option><option value="E">E</option><option value="F">F</option><option value="G">G</option></select>
          </div>
        </div>
      </div>

      <div id="selectivity" class="calc-section" data-calc="selectivity">
        <div class="form-grid">
          <div class="input-group"><label data-i18n="selUpBreaker"></label><select id="sel-up-b" class="std-select" data-std="breaker" data-default="63"></select></div>
          <div class="input-group"><label data-i18n="selDownBreaker"></label><select id="sel-down-b" class="std-select" data-std="breaker" data-default="16"></select></div>
          <div class="input-group"><label data-i18n="selUpCurve"></label><select id="sel-up-c" class="std-select" data-std="curve" data-default="C"></select></div>
          <div class="input-group"><label data-i18n="selDownCurve"></label><select id="sel-down-c" class="std-select" data-std="curve" data-default="C"></select></div>
          <div class="input-group"><label data-i18n="selUpDdrMa"></label><select id="sel-up-ddr-ma" class="std-select" data-std="ddr-ma" data-default="300"></select></div>
          <div class="input-group"><label data-i18n="selUpDdrType"></label><select id="sel-up-ddr" class="std-select" data-std="ddr-type" data-default="AC"></select></div>
          <div class="input-group"><label data-i18n="selDownDdrMa"></label><select id="sel-down-ddr-ma" class="std-select" data-std="ddr-ma" data-default="30"></select></div>
          <div class="input-group"><label data-i18n="selDownDdrType"></label><select id="sel-down-ddr" class="std-select" data-std="ddr-type" data-default="AC"></select></div>
          <div class="input-group full"><label><input type="checkbox" id="sel-chrono"> <span data-i18n="selChrono"></span></label></div>
        </div>
      </div>

      <div id="icc" class="calc-section" data-calc="icc">
        <div class="form-grid">
          <div class="input-group"><label data-i18n="iccSn"></label><select id="icc-kva" class="std-select" data-std="transfo-kva" data-default="250"></select></div>
          <div class="input-group"><label data-i18n="iccUcc"></label><input type="number" id="icc-ucc" value="4" step="0.1"></div>
          <div class="input-group"><label data-i18n="iccPcc"></label><input type="number" id="icc-pcc" value="500"></div>
          <div class="input-group"><label data-i18n="iccLength"></label><input type="number" id="icc-l"></div>
          <div class="input-group"><label data-i18n="iccSection"></label><select id="icc-s" class="std-select" data-std="section" data-default="16"></select></div>
          <div class="input-group full"><label data-i18n="iccServiceVoltage"></label>
            <div class="voltage-selector" data-voltage-target="icc-u">
              <button type="button" class="voltage-btn" data-v="230">230V</button>
              <button type="button" class="voltage-btn active" data-v="400">400V</button>
            </div>
            <input type="hidden" id="icc-u" value="400">
          </div>
          <div class="input-group"><label data-i18n="labelConductor"></label><select id="icc-conductor" data-i18n-select="conductor"><option value="Cu" data-i18n-opt="conductorCu"></option><option value="Al" data-i18n-opt="conductorAl"></option></select></div>
        </div>
      </div>

      <div id="breaking" class="calc-section" data-calc="breaking_time">
        <div class="sub-type-selector">
          <button type="button" class="sub-type-btn active" data-brk-sub="normative" data-i18n="brkModeNormative"></button>
          <button type="button" class="sub-type-btn" data-brk-sub="device" data-i18n="brkModeDevice"></button>
        </div>
        <input type="hidden" id="breaking-mode" value="normative">
        <div class="form-grid">
          <div data-brk-group="normative" class="show">
            <div class="input-group"><label data-i18n="brkEarth"></label><select id="brk-earth"><option>TN</option><option>TT</option><option>IT</option></select></div>
            <div class="input-group"><label data-i18n="brkU0"></label><select id="brk-u0"><option value="120">120</option><option value="230" selected>230</option><option value="400">400</option></select></div>
            <div class="input-group"><label data-i18n="brkCircuit"></label><select id="brk-circuit" data-i18n-select="brkCircuit"><option value="socket_32" data-i18n-opt="brkCkt_socket_32"></option><option value="fixed_final" data-i18n-opt="brkCkt_fixed_final"></option><option value="distribution" data-i18n-opt="brkCkt_distribution"></option><option value="portable" data-i18n-opt="brkCkt_portable"></option></select></div>
          </div>
          <div data-brk-group="device">
            <div class="input-group"><label data-i18n="brkIn"></label><select id="brk-in" class="std-select" data-std="breaker" data-default="16"></select></div>
            <div class="input-group"><label data-i18n="brkCurve"></label><select id="brk-curve" class="std-select" data-std="curve" data-default="C"></select></div>
            <div class="input-group"><label data-i18n="brkSection"></label><select id="brk-s" class="std-select" data-std="section" data-default="2.5"></select></div>
            <div class="input-group"><label data-i18n="brkIk"></label><input type="number" id="brk-ik" data-i18n-placeholder="phIk"></div>
          </div>
        </div>
      </div>

      <div id="balance" class="calc-section" data-calc="power_balance">
        <div class="form-grid">
          <div class="input-group full"><label data-i18n="labelVoltage"></label>
            <div class="voltage-selector" data-voltage-target="balance-u">
              <button type="button" class="voltage-btn active" data-v="230">230V</button>
              <button type="button" class="voltage-btn" data-v="400">400V</button>
            </div>
            <input type="hidden" id="balance-u" value="230">
          </div>
          <div class="input-group"><label data-i18n="labelCosPhi"></label><input type="number" id="balance-cos" value="0.9"></div>
        </div>
        <p style="font-size:0.8rem;color:var(--muted);margin:12px 0 8px" data-i18n="balanceHint"></p>
        <div data-balance-row class="balance-row">
          <input class="bal-label" data-i18n-placeholder="phBalanceLabel" aria-label="label">
          <input class="bal-p" type="number" data-i18n-placeholder="phBalancePi">
          <input class="bal-ku" type="number" value="1" data-i18n-placeholder="phBalanceKu" aria-label="Ku">
          <input class="bal-ks" type="number" value="1" data-i18n-placeholder="phBalanceKs" aria-label="Ks">
        </div>
        <div data-balance-row class="balance-row">
          <input class="bal-label" data-i18n-placeholder="phBalanceLabel">
          <input class="bal-p" type="number">
          <input class="bal-ku" type="number" value="1" data-i18n-placeholder="phBalanceKu">
          <input class="bal-ks" type="number" value="1" data-i18n-placeholder="phBalanceKs">
        </div>
      </div>

      <div id="tripcurve" class="calc-section" data-calc="trip_curve">
        <div class="form-grid">
          <div class="input-group"><label data-i18n="tcRole"></label>
            <select id="tc-role"><option value="aval" data-i18n-opt="tcRoleAval"></option><option value="amont" data-i18n-opt="tcRoleAmont"></option><option value="autre" data-i18n-opt="tcRoleNone"></option></select>
          </div>
          <div class="input-group"><label data-i18n="tcDevice"></label>
            <select id="tc-device"><option value="mcb" data-i18n-opt="tcDevMcb"></option><option value="mccb" data-i18n-opt="tcDevMccb"></option><option value="gg" data-i18n-opt="tcDevGg"></option><option value="am" data-i18n-opt="tcDevAm"></option></select>
          </div>
          <div class="input-group"><label data-i18n="tcIn"></label><select id="tc-in" class="std-select" data-std="breaker" data-default="16"></select></div>
          <div class="input-group" id="tc-curve-group"><label data-i18n="tcCurve"></label><select id="tc-curve" class="std-select" data-std="curve" data-default="C"></select></div>
          <div class="input-group" id="tc-ir-group" style="display:none"><label data-i18n="tcIr"></label><input type="number" id="tc-ir" step="0.05" min="0.4" max="1" value="1"></div>
          <div class="input-group" id="tc-im-group" style="display:none"><label data-i18n="tcIm"></label><input type="number" id="tc-im" step="0.5" min="1.5" max="15" value="10"></div>
          <div class="input-group" style="align-self:end"><button type="button" class="sub-type-btn active" id="tc-add" data-i18n="tcAdd"></button></div>
          <div class="input-group" style="align-self:end"><button type="button" class="sub-type-btn" id="tc-clear" data-i18n="tcClear"></button></div>
          <div class="input-group"><label data-i18n="tcIcc"></label><input type="number" id="tc-icc" step="100" min="0" data-i18n-placeholder="tcIccPh"></div>
        </div>
        <div class="tc-pro-bar">
          <button type="button" class="tc-pro-toggle" id="tc-pro-toggle" aria-expanded="false" data-i18n="tcProToggle"></button>
        </div>
        <div id="tc-pro" class="tc-pro" hidden>
          <p class="tc-disclaimer" data-i18n="tcDisclaimer"></p>
          <div class="form-grid">
            <div class="input-group"><label data-i18n="tcIcu"></label><input type="number" id="tc-icu" step="0.5" min="0" data-i18n-placeholder="tcIcuPh"></div>
            <div class="input-group"><label data-i18n="tcCableS"></label>
              <select id="tc-cable-s">
                <option value="" data-i18n-opt="tcCableNone"></option>
                <option value="1.5">1,5 mm²</option><option value="2.5">2,5 mm²</option><option value="4">4 mm²</option>
                <option value="6">6 mm²</option><option value="10">10 mm²</option><option value="16">16 mm²</option>
                <option value="25">25 mm²</option><option value="35">35 mm²</option><option value="50">50 mm²</option>
                <option value="70">70 mm²</option><option value="95">95 mm²</option><option value="120">120 mm²</option>
                <option value="150">150 mm²</option><option value="185">185 mm²</option><option value="240">240 mm²</option>
              </select>
            </div>
            <div class="input-group"><label data-i18n="tcCableMat"></label>
              <select id="tc-cable-mat"><option value="cu" data-i18n-opt="tcMatCu"></option><option value="al" data-i18n-opt="tcMatAl"></option></select>
            </div>
            <div class="input-group"><label data-i18n="tcCableIns"></label>
              <select id="tc-cable-ins"><option value="pvc" data-i18n-opt="tcInsPvc"></option><option value="pr" data-i18n-opt="tcInsPr"></option></select>
            </div>
          </div>
          <div id="tc-pro-result" class="tc-pro-result"></div>
        </div>
        <div id="tc-verdict" class="tc-verdict"></div>
        <div id="tc-legend" class="tc-legend"></div>
        <canvas id="tc-canvas" class="tc-canvas" width="900" height="540"></canvas>
        <div class="tc-export">
          <button type="button" id="tc-export-png" class="tc-mini-btn" data-i18n="tcExportPng"></button>
          <button type="button" id="tc-export-pdf" class="tc-mini-btn" data-i18n="tcExportPdf"></button>
        </div>
        <p class="tc-note" data-i18n="tcNote"></p>
      </div>

      <button type="button" class="btn-calc" id="btn-calculate"></button>
      <div id="calc-global-result" class="result-box"></div>

      <div class="calc-help" id="calc-help">
        <h4 id="calc-help-title"></h4>
        <p id="calc-help-text"></p>
      </div>
    </div>
  </div>

  <footer style="text-align:center;padding:40px;color:var(--muted)"><p data-i18n="footerCopy"></p></footer>

  <script src="js/site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/calcul-electrique-i18n.js"></script>
  <script src="js/visitor-counter.js"></script>
  <script src="js/calc-standards.js"></script>
  <script src="js/cableThermalIEC60364.js"></script>
  <script src="js/calcul-electrique-engine.js"></script>
  <script src="js/calcul-electrique-extra.js"></script>
  <script src="js/courbes-protection.js"></script>
  <script src="js/calcul-electrique.js" defer></script>
</body>
</html>
